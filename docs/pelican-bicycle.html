<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>鹈鹕骑自行车 · SVG 动画</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 18%, #1d2733, #0a0e13 72%);
    font-family: ui-sans-serif, system-ui, "Segoe UI", sans-serif;
  }
  .stage {
    width: min(94vw, 1180px);
    aspect-ratio: 3 / 2;
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .6), 0 0 0 1px rgba(255, 255, 255, .07);
    background: #bfe3f7;
  }
  svg { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
<div class="stage">
<svg id="scene" viewBox="0 0 900 600" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-labelledby="title desc">
  <title id="title">鹈鹕骑自行车</title>
  <desc id="desc">一只鹈鹕踩着踏板、骑着红色自行车向右前进的循环动画</desc>

  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7cc6ea" />
      <stop offset="52%" stop-color="#cfe9f7" />
      <stop offset="100%" stop-color="#f8f1dd" />
    </linearGradient>

    <radialGradient id="sunGlow">
      <stop offset="0%" stop-color="#fff4c6" stop-opacity=".95" />
      <stop offset="100%" stop-color="#fff4c6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#fffdf8" />
      <stop offset="62%" stop-color="#f6eeda" />
      <stop offset="100%" stop-color="#e1d4b8" />
    </linearGradient>

    <linearGradient id="wingGrad" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0%" stop-color="#fbf5e7" />
      <stop offset="100%" stop-color="#dbcdb0" />
    </linearGradient>

    <linearGradient id="beakGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f9cc63" />
      <stop offset="100%" stop-color="#e59a2e" />
    </linearGradient>

    <linearGradient id="pouchGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7c968" />
      <stop offset="100%" stop-color="#de8526" />
    </linearGradient>

    <linearGradient id="frameGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f0705f" />
      <stop offset="100%" stop-color="#c53c37" />
    </linearGradient>

    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#b9aa8b" />
      <stop offset="100%" stop-color="#a2947a" />
    </linearGradient>

    <filter id="blur6" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>

    <pattern id="roadDashes" width="140" height="600" patternUnits="userSpaceOnUse">
      <rect x="14" y="518" width="58" height="6" rx="3" fill="#f2e8cd" opacity=".5" />
    </pattern>

    <g id="cloudSet">
      <g opacity=".9">
        <ellipse cx="120" cy="108" rx="52" ry="24" fill="#fff" />
        <ellipse cx="86"  cy="118" rx="34" ry="18" fill="#fff" />
        <ellipse cx="156" cy="118" rx="38" ry="20" fill="#fff" />
      </g>
      <g opacity=".75">
        <ellipse cx="430" cy="72" rx="38" ry="17" fill="#fff" />
        <ellipse cx="404" cy="80" rx="25" ry="13" fill="#fff" />
        <ellipse cx="458" cy="80" rx="28" ry="15" fill="#fff" />
      </g>
      <g opacity=".85">
        <ellipse cx="716" cy="152" rx="58" ry="26" fill="#fff" />
        <ellipse cx="676" cy="162" rx="38" ry="20" fill="#fff" />
        <ellipse cx="758" cy="162" rx="42" ry="22" fill="#fff" />
      </g>
      <g opacity=".7">
        <ellipse cx="1088" cy="92" rx="44" ry="20" fill="#fff" />
        <ellipse cx="1058" cy="100" rx="28" ry="14" fill="#fff" />
        <ellipse cx="1120" cy="100" rx="32" ry="17" fill="#fff" />
      </g>
      <g stroke="#6f8fa5" stroke-width="2.4" fill="none" stroke-linecap="round" opacity=".55">
        <path d="M540 190 q10 -8 20 0 q10 -8 20 0" />
        <path d="M596 214 q7 -6 14 0 q7 -6 14 0" />
      </g>
    </g>
  </defs>

  <!-- ============ 背景 ============ -->
  <rect x="0" y="0" width="900" height="600" fill="url(#skyGrad)" />
  <circle cx="752" cy="118" r="96" fill="url(#sunGlow)" />
  <circle cx="752" cy="118" r="40" fill="#fff7d2" />

  <g id="clouds">
    <use href="#cloudSet" />
    <use href="#cloudSet" x="1400" />
  </g>

  <!-- 远山 -->
  <path d="M0,470 C90,412 172,452 250,440 C342,426 400,470 500,456
           C600,442 660,402 762,446 C832,477 872,456 900,462
           L900,520 L0,520 Z" fill="#a9c8a3" opacity=".72" />
  <path d="M0,492 C82,462 160,488 242,478 C332,466 382,502 482,492
           C582,482 642,456 742,488 C822,514 870,492 900,498
           L900,545 L0,545 Z" fill="#8fba8d" opacity=".92" />

  <!-- 地面与路面 -->
  <rect x="0" y="500" width="900" height="100" fill="#cdbb95" />
  <rect x="0" y="500" width="900" height="54" fill="url(#roadGrad)" />
  <rect x="0" y="500" width="900" height="3" fill="#7d7160" opacity=".45" />
  <rect x="0" y="500" width="900" height="54" fill="url(#roadDashes)" />

  <!-- 影子 -->
  <ellipse cx="462" cy="503" rx="228" ry="11" fill="#5b5142" opacity=".28" filter="url(#blur6)" />

  <!-- ============ 自行车 ============ -->
  <!-- 后轮 -->
  <circle cx="280" cy="420" r="80" fill="none" stroke="#272b31" stroke-width="13" />
  <circle cx="280" cy="420" r="80" fill="none" stroke="#3d444d" stroke-width="5"
          stroke-dasharray="3 10" opacity=".9" />
  <g id="rearWheel">
    <circle cx="280" cy="420" r="67" fill="none" stroke="#c3ccd6" stroke-width="4" />
    <g stroke="#cfd8e1" stroke-width="2">
      <line x1="280" y1="420" x2="346"    y2="420" />
      <line x1="280" y1="420" x2="326.67" y2="466.67" />
      <line x1="280" y1="420" x2="280"    y2="486" />
      <line x1="280" y1="420" x2="233.33" y2="466.67" />
      <line x1="280" y1="420" x2="214"    y2="420" />
      <line x1="280" y1="420" x2="233.33" y2="373.33" />
      <line x1="280" y1="420" x2="280"    y2="354" />
      <line x1="280" y1="420" x2="326.67" y2="373.33" />
    </g>
    <circle cx="280" cy="420" r="7" fill="#9aa5b1" />
  </g>

  <!-- 前轮 -->
  <circle cx="640" cy="420" r="80" fill="none" stroke="#272b31" stroke-width="13" />
  <circle cx="640" cy="420" r="80" fill="none" stroke="#3d444d" stroke-width="5"
          stroke-dasharray="3 10" opacity=".9" />
  <g id="frontWheel">
    <circle cx="640" cy="420" r="67" fill="none" stroke="#c3ccd6" stroke-width="4" />
    <g stroke="#cfd8e1" stroke-width="2">
      <line x1="640" y1="420" x2="706"    y2="420" />
      <line x1="640" y1="420" x2="686.67" y2="466.67" />
      <line x1="640" y1="420" x2="640"    y2="486" />
      <line x1="640" y1="420" x2="593.33" y2="466.67" />
      <line x1="640" y1="420" x2="574"    y2="420" />
      <line x1="640" y1="420" x2="593.33" y2="373.33" />
      <line x1="640" y1="420" x2="640"    y2="354" />
      <line x1="640" y1="420" x2="686.67" y2="373.33" />
    </g>
    <circle cx="640" cy="420" r="7" fill="#9aa5b1" />
  </g>

  <!-- 链条 -->
  <path d="M470,406 L280,408 A12,12 0 0 0 280,432 L470,450 A22,22 0 0 0 470,406 Z"
        fill="none" stroke="#5c636d" stroke-width="4" stroke-linejoin="round" />
  <path id="chainDash" d="M470,406 L280,408 A12,12 0 0 0 280,432 L470,450 A22,22 0 0 0 470,406 Z"
        fill="none" stroke="#aeb8c3" stroke-width="3" stroke-dasharray="4 4" />

  <!-- 飞轮与牙盘 -->
  <g id="cog">
    <circle cx="280" cy="420" r="12" fill="none" stroke="#9aa5b1" stroke-width="5" />
  </g>
  <g id="chainRing">
    <circle cx="470" cy="428" r="24" fill="none" stroke="#8e99a5" stroke-width="4"
            stroke-dasharray="4 4" />
    <circle cx="470" cy="428" r="15" fill="none" stroke="#b8c2cc" stroke-width="3" />
  </g>

  <!-- 远侧腿（在车架之后） -->
  <path id="farLeg" d="M397,295 L420,360 L470,398" fill="none" stroke="#c98a2e"
        stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  <line id="farCrank" x1="470" y1="428" x2="470" y2="398" stroke="#6f7883"
        stroke-width="7" stroke-linecap="round" />
  <g id="farPedal">
    <rect x="-12" y="-4" width="24" height="8" rx="3" fill="#4a5058" />
  </g>
  <g id="farFoot">
    <path d="M-12,2 L0,-6 L12,2 L6,7 L-6,7 Z" fill="#c98a2e" stroke="#a9721f"
          stroke-width="1.2" stroke-linejoin="round" />
  </g>

  <!-- 车架 -->
  <g fill="none" stroke="url(#frameGrad)" stroke-width="9" stroke-linecap="round">
    <line x1="470" y1="428" x2="280" y2="420" />   <!-- 后下叉 -->
    <line x1="400" y1="288" x2="280" y2="420" />   <!-- 后上叉 -->
    <line x1="470" y1="428" x2="400" y2="288" />   <!-- 座管 -->
    <line x1="470" y1="428" x2="610" y2="336" />   <!-- 下管 -->
    <line x1="400" y1="288" x2="596" y2="272" />   <!-- 上管 -->
  </g>
  <line x1="596" y1="272" x2="610" y2="336" stroke="#b03530" stroke-width="12"
        stroke-linecap="round" />
  <line x1="610" y1="336" x2="640" y2="420" stroke="#8e99a5" stroke-width="8"
        stroke-linecap="round" />
  <line x1="596" y1="272" x2="590" y2="248" stroke="#8e99a5" stroke-width="7"
        stroke-linecap="round" />
  <path d="M590,248 Q600,235 616,237" fill="none" stroke="#8e99a5" stroke-width="7"
        stroke-linecap="round" />
  <line x1="604" y1="238" x2="624" y2="236" stroke="#3b4149" stroke-width="10"
        stroke-linecap="round" />
  <line x1="400" y1="288" x2="398" y2="276" stroke="#8e99a5" stroke-width="7"
        stroke-linecap="round" />
  <path d="M368,278 Q398,266 428,276 Q432,284 418,289 Q396,294 372,289 Q364,284 368,278 Z"
        fill="#3b4149" />

  <!-- ============ 鹈鹕 ============ -->
  <g id="pelican">
    <!-- 尾羽 -->
    <path d="M352,252 L300,268 L322,280 L302,292 L354,288 Z"
          fill="#ece2cb" stroke="#d3c6a9" stroke-width="2" stroke-linejoin="round" />

    <!-- 远侧翅膀 -->
    <path d="M356,212 C330,230 322,262 334,282 C352,266 376,252 394,246 Z"
          fill="#e7dcc4" stroke="#cdbf9f" stroke-width="2" stroke-linejoin="round" />

    <!-- 身体 -->
    <ellipse cx="400" cy="238" rx="62" ry="54" transform="rotate(-10 400 238)"
             fill="url(#bodyGrad)" stroke="#d8cbb0" stroke-width="2" />
    <ellipse cx="392" cy="256" rx="40" ry="26" transform="rotate(-8 392 256)"
             fill="#fdf8ec" opacity=".55" />

    <!-- 脖子 -->
    <path d="M414,200 C418,162 442,138 472,132" fill="none" stroke="#d8cbb0"
          stroke-width="36" stroke-linecap="round" />
    <path d="M414,200 C418,162 442,138 472,132" fill="none" stroke="#f8f1e0"
          stroke-width="31" stroke-linecap="round" />

    <!-- 头 + 喙 -->
    <g id="headGroup">
      <path d="M464,108 Q446,96 440,80 Q458,90 470,98 Z"
            fill="#f2e8d2" stroke="#d8cbb0" stroke-width="1.5" stroke-linejoin="round" />
      <circle cx="486" cy="126" r="27" fill="url(#bodyGrad)" stroke="#d8cbb0" stroke-width="2" />

      <!-- 喉囊 -->
      <path d="M496,140 L646,160 Q606,214 556,206 Q512,196 496,150 Z"
            fill="url(#pouchGrad)" stroke="#c98420" stroke-width="2" stroke-linejoin="round" />
      <!-- 上喙 -->
      <path d="M498,112 L646,146 L650,162 L496,142 Z"
            fill="url(#beakGrad)" stroke="#c98420" stroke-width="2" stroke-linejoin="round" />
      <path d="M516,124 L596,140" stroke="#c98420" stroke-width="2" opacity=".5"
            stroke-linecap="round" />

      <!-- 眼睛 -->
      <circle cx="492" cy="110" r="5.2" fill="#2b2b2b" />
      <circle cx="490.4" cy="108.2" r="1.7" fill="#fff" />
    </g>

    <!-- 近侧翅膀（扶着车把） -->
    <g id="wingNear">
      <path d="M430,192 C468,182 512,196 552,218 C578,232 602,238 616,236
               C620,248 606,258 586,256 C544,252 496,242 458,240
               C430,238 416,216 430,192 Z"
            fill="url(#wingGrad)" stroke="#c9bb9c" stroke-width="2" stroke-linejoin="round" />
      <g fill="none" stroke="#cbbda0" stroke-width="2" stroke-linecap="round" opacity=".75">
        <path d="M470,206 C500,214 528,226 556,238" />
        <path d="M466,220 C498,230 524,240 550,246" />
        <path d="M462,232 C492,240 514,246 536,250" />
      </g>
    </g>
  </g>

  <!-- 近侧曲柄 + 踏板 -->
  <line id="nearCrank" x1="470" y1="428" x2="470" y2="458" stroke="#8e99a5"
        stroke-width="7" stroke-linecap="round" />
  <g id="nearPedal">
    <rect x="-13" y="-4" width="26" height="8" rx="3" fill="#4a5058" />
  </g>

  <!-- 近侧腿 -->
  <path id="nearLeg" d="M407,298 L430,360 L470,458" fill="none" stroke="#f0a93a"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round" />
  <g id="nearFoot">
    <path d="M-13,2 L0,-7 L13,2 L7,8 L-7,8 Z" fill="#f0a93a" stroke="#c98a2e"
          stroke-width="1.4" stroke-linejoin="round" />
  </g>
</svg>
</div>

<script>
(function () {
  "use strict";

  var $ = function (id) { return document.getElementById(id); };

  var rearWheel  = $("rearWheel");
  var frontWheel = $("frontWheel");
  var cog        = $("cog");
  var chainRing  = $("chainRing");
  var chainDash  = $("chainDash");
  var nearCrank  = $("nearCrank");
  var farCrank   = $("farCrank");
  var nearPedal  = $("nearPedal");
  var farPedal   = $("farPedal");
  var nearFoot   = $("nearFoot");
  var farFoot    = $("farFoot");
  var nearLeg    = $("nearLeg");
  var farLeg     = $("farLeg");
  var pelican    = $("pelican");
  var headGroup  = $("headGroup");
  var wingNear   = $("wingNear");
  var roadDashes = $("roadDashes");
  var clouds     = $("clouds");

  // 车体关键点（与 SVG 中的坐标一致）
  var BB      = { x: 470, y: 428 };  // 中轴
  var CRANK_R = 30;                  // 曲柄长度
  var HIP     = { x: 404, y: 298 };  // 髋关节
  var THIGH   = 95;
  var SHANK   = 95;

  var WHEEL_DEG_PER_SEC = 165;   // 车轮角速度
  var CRANK_RAD_PER_SEC = 1.75;  // 踏频
  var ROAD_SPEED        = 210;   // 路面滚动速度 px/s
  var ROAD_TILE         = 140;   // 与 pattern 宽度一致
  var CLOUD_SPEED       = 16;
  var CLOUD_TILE        = 1400;  // 与 <use x="1400"> 一致

  // 两段式腿部 IK：返回膝盖坐标（膝盖朝前）
  function solveKnee(hx, hy, px, py, l1, l2) {
    var dx = px - hx, dy = py - hy;
    var raw = Math.sqrt(dx * dx + dy * dy) || 1e-6;
    var ux = dx / raw, uy = dy / raw;
    var d = Math.min(l1 + l2 - 0.5, Math.max(Math.abs(l1 - l2) + 0.5, raw));
    var a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    var bx = hx + ux * a, by = hy + uy * a;
    return { x: bx + uy * h, y: by - ux * h };
  }

  var t = 0;
  var prev = performance.now();

  function tick(now) {
    var dt = Math.min(0.05, (now - prev) / 1000);
    prev = now;
    t += dt;

    // 车轮
    var wheelDeg = (t * WHEEL_DEG_PER_SEC) % 360;
    rearWheel.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + " 280 420)");
    frontWheel.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + " 640 420)");
    cog.setAttribute("transform", "rotate(" + wheelDeg.toFixed(2) + " 280 420)");

    // 曲柄
    var crank = t * CRANK_RAD_PER_SEC;
    chainRing.setAttribute("transform",
      "rotate(" + ((crank * 180 / Math.PI) % 360).toFixed(2) + " 470 428)");

    // 随踏频起伏的身体/头/翅膀
    var bob = Math.sin(crank * 2) * 2.5;
    pelican.setAttribute("transform", "translate(0 " + bob.toFixed(2) + ")");
    headGroup.setAttribute("transform",
      "rotate(" + (Math.sin(crank * 2 + 0.6) * 1.4).toFixed(2) + " 470 150)");
    wingNear.setAttribute("transform",
      "rotate(" + (Math.sin(crank * 2) * 1.6).toFixed(2) + " 436 208)");

    // 两侧踏板位置
    var c = Math.cos(crank), s = Math.sin(crank);
    var p1 = { x: BB.x + CRANK_R * c, y: BB.y + CRANK_R * s };
    var p2 = { x: BB.x - CRANK_R * c, y: BB.y - CRANK_R * s };

    nearCrank.setAttribute("x2", p1.x.toFixed(2));
    nearCrank.setAttribute("y2", p1.y.toFixed(2));
    farCrank.setAttribute("x2", p2.x.toFixed(2));
    farCrank.setAttribute("y2", p2.y.toFixed(2));

    nearPedal.setAttribute("transform", "translate(" + p1.x.toFixed(2) + " " + p1.y.toFixed(2) + ")");
    farPedal.setAttribute("transform", "translate(" + p2.x.toFixed(2) + " " + p2.y.toFixed(2) + ")");
    nearFoot.setAttribute("transform", "translate(" + p1.x.toFixed(2) + " " + (p1.y - 5).toFixed(2) + ")");
    farFoot.setAttribute("transform", "translate(" + p2.x.toFixed(2) + " " + (p2.y - 5).toFixed(2) + ")");

    // 腿部 IK
    var hipNear = { x: HIP.x + 3, y: HIP.y + bob };
    var hipFar  = { x: HIP.x - 7, y: HIP.y + bob - 3 };
    var kNear = solveKnee(hipNear.x, hipNear.y, p1.x, p1.y, THIGH, SHANK);
    var kFar  = solveKnee(hipFar.x,  hipFar.y,  p2.x, p2.y, THIGH, SHANK);

    nearLeg.setAttribute("d",
      "M" + hipNear.x + "," + hipNear.y.toFixed(2) +
      " L" + kNear.x.toFixed(2) + "," + kNear.y.toFixed(2) +
      " L" + p1.x.toFixed(2) + "," + p1.y.toFixed(2));
    farLeg.setAttribute("d",
      "M" + hipFar.x + "," + hipFar.y.toFixed(2) +
      " L" + kFar.x.toFixed(2) + "," + kFar.y.toFixed(2) +
      " L" + p2.x.toFixed(2) + "," + p2.y.toFixed(2));

    // 路面与云层滚动
    roadDashes.setAttribute("patternTransform",
      "translate(" + (-((t * ROAD_SPEED) % ROAD_TILE)).toFixed(2) + " 0)");
    clouds.setAttribute("transform",
      "translate(" + (-((t * CLOUD_SPEED) % CLOUD_TILE)).toFixed(2) + " 0)");

    // 链条流动
    chainDash.setAttribute("stroke-dashoffset", (-((t * 55) % 8)).toFixed(2));

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
