<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>深渊远征 · 高保真稿 v4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700;900&family=Oswald:wght@500;600&display=swap" rel="stylesheet">
<style>
/* ================= 视觉规范（v3） =================
   一级页面只放"现在要做的决定"：每屏 1 个主按钮，信息不超过 3 组；说明、明细、列表一律收进二级页（右侧抽屉）。
   不写英文副标题，不堆统计数字。数字只在玩家要据此做决定时出现。
   字号 6 档：40 / 28 / 20 / 16 / 14 / 13。颜色：金 = 主操作与收益；青 = 选中；珊瑚红 = 代价与危险；绿 = 安全。
   队伍卡与敌方卡沿用游戏现有的出战准备卡（src/meta/screens/regionalScreen.css 的 rg-troop）。 */
:root{
  --ink:#f5f7ff; --ink2:#c6cfe6; --ink3:#93a0c2;
  --line:rgba(205,222,255,.16); --line2:rgba(205,222,255,.3);
  --cy:#74e4ff; --gold:#ffcf6b; --red:#ff7088; --green:#72e6a8;
  --r0:#aab2ad; --r1:#4fcf8a; --r2:#a66bff; --r3:#ffd84a; --r4:#f08a3c; --r5:#56d8ff;
  --sans:"Noto Sans SC","Microsoft YaHei","PingFang SC",sans-serif;
  --num:"Oswald","Noto Sans SC",sans-serif;
  --panel:linear-gradient(180deg,rgba(32,42,88,.82),rgba(22,30,68,.88));
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#0a1024;color:var(--ink);font:14px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
button:focus{outline:none}
button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
img{display:block}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums}
.muted{color:var(--ink3)} .good{color:var(--green)} .bad{color:var(--red)} .gold{color:var(--gold)}
.grow{flex:1;min-width:0}

/* 原型工具条（不属于游戏画面） */
.proto{position:fixed;inset:0 0 auto 0;height:40px;z-index:100;display:flex;align-items:center;gap:6px;padding:0 14px;background:#0d1430;border-bottom:1px solid #222d52;font-size:13px;color:#aab4d4}
.proto strong{color:#e8ecff;margin-right:10px}
.proto button{height:28px;padding:0 12px;border-radius:8px;color:#c9d1ee}
.proto button.on{background:#e8ecff;color:#0d1430;font-weight:700}
.proto .sp{flex:1}
.proto .seedbox{display:flex;align-items:center;gap:6px;padding-left:12px;border-left:1px solid #2a3560}
.proto input,.proto select{height:28px;padding:0 8px;border-radius:7px;border:1px solid #2f3b6a;background:#141c3d;color:#e8ecff;font-size:13px}
.proto input{width:130px}
.proto input[type=checkbox]{width:16px;height:16px;padding:0;accent-color:#8fb4ff}
.proto .ghost{border:1px solid #2f3b6a}
.proto label{display:flex;align-items:center;gap:6px;margin-left:12px;cursor:pointer}
#viewport{position:fixed;inset:40px 0 0 0;overflow:hidden;display:grid;place-items:center}
#stage{position:relative;width:1600px;height:900px;flex:none;overflow:hidden;transform-origin:center;background:#16204a}

.screen{position:absolute;inset:0;display:none}
.screen.on{display:block}
.bg{position:absolute;inset:0;background-size:cover;background-position:50% 50%}
.shade{position:absolute;inset:0;pointer-events:none}

/* —— 通用组件 —— */
/* 面板：和营地同一档靛蓝，不加顶部亮线（v4 审稿 G9） */
.glass{position:absolute;background:var(--panel);backdrop-filter:blur(18px) saturate(1.2);-webkit-backdrop-filter:blur(18px) saturate(1.2);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px rgba(6,10,32,.3)}
.sh{display:flex;align-items:center;gap:10px;padding:18px 22px 12px}
.sh h3{margin:0;font:700 20px var(--sans)}
.sh small{color:var(--ink3);font-size:13px}
.sh .btn{margin-left:auto}
/* 按钮（v4 审稿 G4/G5）：主按钮是竖向短渐变的暖金，深金描边 + 靛蓝落影，不发黄光、不加白色内高光；
   次按钮是实色靛蓝底，不是网页式的透明线框 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:10px;background:rgba(38,49,100,.8);border:1px solid rgba(190,208,255,.24);font:600 15px var(--sans);color:#e8eeff;box-shadow:0 4px 10px rgba(8,12,36,.22);backdrop-filter:blur(10px);transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{background:rgba(52,66,128,.86);border-color:rgba(190,208,255,.42)}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.text{background:none;border-color:transparent;box-shadow:none;backdrop-filter:none;color:var(--ink2)}
.btn.text:hover{color:var(--ink);background:rgba(255,255,255,.06)}
.primary{display:inline-flex;align-items:center;justify-content:center;gap:10px;height:56px;padding:0 28px;border-radius:12px;background:linear-gradient(180deg,#ffd982 0%,#f4bc56 100%);color:#3a2604;font:700 18px/1 var(--sans);letter-spacing:.04em;box-shadow:0 0 0 1px rgba(150,96,20,.55),0 6px 16px rgba(8,12,40,.34);transition:background .15s,transform .15s;white-space:nowrap}
.primary:hover{background:linear-gradient(180deg,#ffe08f 0%,#f7c464 100%)} .primary:active{transform:translateY(1px)}
.primary small{font:500 14px var(--sans);letter-spacing:0;color:#6a4a10}
.primary svg.i{width:20px;height:20px;stroke-width:2.2}
.primary[disabled]{background:rgba(255,255,255,.08);color:var(--ink3);box-shadow:inset 0 0 0 1px var(--line);cursor:not-allowed}
.primary[disabled] small{color:var(--ink3)}
/* 撤离用绿色，和金色的常规动作分开 */
.primary.exit{background:linear-gradient(180deg,#8ff0bd,#5fd394);color:#0e3a24;box-shadow:0 0 0 1px rgba(30,110,70,.55),0 6px 16px rgba(8,12,40,.34)}
.primary.exit small{color:#1d5a3a}
.chip{height:32px;padding:0 14px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(205,222,255,.16);color:var(--ink2);font:500 13px var(--sans)}
.chip:hover{background:rgba(255,255,255,.09)}
.chip.on{background:rgba(116,228,255,.12);border-color:rgba(116,228,255,.5);color:#e6fbff;font-weight:700}
.seg{display:flex;padding:3px;border-radius:12px;background:rgba(6,10,28,.45);border:1px solid var(--line)}
.seg button{flex:1;height:38px;border-radius:9px;color:var(--ink2);font-size:14px}
.seg button.on{background:rgba(116,228,255,.2);box-shadow:inset 0 0 0 1px rgba(116,228,255,.6);color:#e6fbff;font-weight:700}
.seg button.off{opacity:.6;color:var(--ink3)}
.seg button.off svg.i{width:14px;height:14px;vertical-align:-2px;margin-left:2px}
/* 标签用 6px 小圆角（只有地图上的地名牌保留全圆胶囊） */
.tag{display:inline-flex;align-items:center;gap:5px;height:24px;padding:0 8px;border-radius:6px;font:500 13px var(--sans);background:rgba(14,22,50,.62);box-shadow:inset 0 0 0 1px rgba(205,222,255,.16);color:var(--ink2);white-space:nowrap}
.tag b{font-weight:700;margin-right:2px}
.tag.red{background:rgba(255,112,136,.14);box-shadow:inset 0 0 0 1px rgba(255,112,136,.32);color:#ffc7d1}
.tag.cy{background:rgba(116,228,255,.12);box-shadow:inset 0 0 0 1px rgba(116,228,255,.34);color:#d2f8ff}
.tag.gold{background:rgba(255,207,107,.14);box-shadow:inset 0 0 0 1px rgba(255,207,107,.34);color:#ffe6ad}
.tag.good{background:rgba(114,230,168,.14);box-shadow:inset 0 0 0 1px rgba(114,230,168,.34);color:#c8f7dc}
.tag.vio{background:rgba(201,168,255,.14);box-shadow:inset 0 0 0 1px rgba(201,168,255,.34);color:#e6dbff}
.dot{position:absolute;top:12px;right:12px;width:9px;height:9px;border-radius:50%;background:#ff5c74;box-shadow:0 0 0 2px rgba(14,22,48,.6)}

/* 物品框（v4 审稿 G1–G3）：底色统一成靛蓝石板，稀有度只看描边和底部一层淡色晕，不铺整块颜色、不加底部色条 */
.it{--rc:var(--r0);--s:64px;position:relative;width:var(--s);height:var(--s);flex:none;border-radius:10px;display:grid;place-items:center;overflow:hidden;
  background:radial-gradient(95% 70% at 50% 105%,color-mix(in srgb,var(--rc) 30%,transparent) 0%,transparent 72%),#263166;
  box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--rc) 80%,#263166),0 3px 8px rgba(8,12,36,.3)}
.it.r4,.it.r5{box-shadow:inset 0 0 0 2px var(--rc),0 3px 8px rgba(8,12,36,.3)}
.it img{width:82%;height:82%;object-fit:contain;filter:drop-shadow(0 2px 2px rgba(10,16,40,.4))}
.it .q{position:absolute;right:3px;bottom:3px;min-width:clamp(16px,calc(var(--s)*.24),22px);height:clamp(16px,calc(var(--s)*.24),22px);padding:0 5px;border-radius:6px;
  background:rgba(12,18,44,.86);box-shadow:inset 0 0 0 1px rgba(205,222,255,.18);font:600 clamp(11px,calc(var(--s)*.16),14px)/clamp(16px,calc(var(--s)*.24),22px) var(--num);color:#eef3ff;text-align:center}
.it .new{position:absolute;right:5px;top:5px;width:8px;height:8px;border-radius:50%;background:#74e4ff;box-shadow:0 0 0 2px rgba(12,18,44,.8)}
.it.empty{background:rgba(10,16,40,.3);border:0;box-shadow:inset 0 2px 6px rgba(6,10,30,.45),inset 0 0 0 1px rgba(205,222,255,.1);color:var(--ink3)}
button.it:hover{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--rc) 90%,#fff),0 3px 8px rgba(8,12,36,.3)}
.it.sel{box-shadow:inset 0 0 0 2px var(--rc),0 0 0 2px var(--cy)}
.it.r1{--rc:var(--r1)} .it.r2{--rc:var(--r2)} .it.r3{--rc:var(--r3)} .it.r4{--rc:var(--r4)} .it.r5{--rc:var(--r5)}
/* 保险格 = 安全 = 绿色（青色只表示选中） */
.it .safe{position:absolute;left:4px;top:4px;width:20px;height:20px;border-radius:6px;background:#0f2e24;display:grid;place-items:center;color:var(--green)}
.it .safe svg{width:13px;height:13px;stroke-width:2.4}

/* 顶栏 */
.topbar{position:absolute;left:0;right:0;top:0;height:84px;display:flex;align-items:center;gap:16px;padding:0 40px;z-index:5}
.back{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(30,40,84,.74);border:1px solid rgba(205,222,255,.22);backdrop-filter:blur(10px);color:#dfe6ff}
.back:hover{background:rgba(48,62,122,.84);color:#fff}
.back svg.i{width:20px;height:20px;stroke-width:2}
.topbar h1{margin:0;font:900 28px/1.2 var(--sans);letter-spacing:.02em;text-shadow:0 2px 12px rgba(10,16,40,.45)}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:10px}
.wallet{display:flex;align-items:center;height:44px;padding:0 6px;border-radius:99px;background:rgba(14,22,48,.55);border:1px solid var(--line);backdrop-filter:blur(10px)}
.wallet .c{display:flex;align-items:center;gap:7px;padding:0 14px;height:30px}
.wallet .c+.c{border-left:1px solid var(--line)}
.wallet img{width:26px;height:26px;object-fit:contain}
.wallet b{font:500 17px var(--num)}
.ib{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(30,40,84,.74);border:1px solid rgba(205,222,255,.22);backdrop-filter:blur(10px);color:#dfe6ff;position:relative}
.ib:hover{color:#fff;background:rgba(48,62,122,.84)}
.ib svg.i{width:20px;height:20px;stroke-width:2}
.ib .dot{top:5px;right:5px}

/* —— 二级页：右侧抽屉 —— */
.sheet{position:absolute;inset:0;z-index:40;display:none;background:rgba(8,12,32,.34)}
.sheet.on{display:block}
/* 抽屉从顶栏 / 局内 HUD 下方开始，高度随内容，不盖住返回键和命数 */
.sheet .card{position:absolute;right:24px;top:96px;max-height:calc(100% - 120px);width:540px;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,rgba(34,44,92,.94),rgba(22,30,68,.96));backdrop-filter:blur(22px);border:1px solid var(--line2);box-shadow:0 24px 60px rgba(4,8,28,.5);animation:slidein .18s ease-out}
.sheet.wide .card{width:760px}
@keyframes slidein{from{transform:translateX(24px);opacity:0}}
.sheet header{display:flex;align-items:center;gap:12px;padding:22px 24px 14px;border-bottom:1px solid var(--line)}
.sheet header h3{margin:0;font:700 20px var(--sans)}
.sheet header small{color:var(--ink3);font-size:13px}
.sheet header .x{margin-left:auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.sheet header .x:hover{background:rgba(255,255,255,.1)}
.sheet .body{flex:0 1 auto;min-height:0;overflow-y:auto;padding:16px 24px 24px;scrollbar-width:thin}
.sheet .foot{padding:16px 24px 22px;border-top:1px solid var(--line);display:flex;gap:10px}
.sheet .foot .primary{flex:1}
.sheet h4{margin:18px 0 10px;font:700 15px var(--sans);color:var(--ink2)}
.sheet h4:first-child{margin-top:4px}
.sheet p{margin:0 0 10px;color:var(--ink2);line-height:1.65}
.lrow{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:14px;width:100%;text-align:left}
.lrow+.lrow{margin-top:6px}
/* 不用斑马纹（看起来像被选中）：说明行一律淡底；可点的行多一道细线，悬停更亮 */
div.lrow{background:rgba(255,255,255,.04)}
button.lrow{background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px var(--line)}
button.lrow:hover{background:rgba(255,255,255,.1)}
.lrow[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.lrow .ck{width:22px;height:22px;border-radius:6px;box-shadow:inset 0 0 0 1.5px var(--line2);display:grid;place-items:center;color:transparent}
.lrow.on .ck{background:var(--cy);color:#0e1a3a;box-shadow:none}
.lrow .ck svg.i{width:14px;height:14px;stroke-width:3}
.sheet p.warn{padding:10px 12px;border-radius:10px;background:rgba(150,110,255,.12);box-shadow:inset 0 0 0 1px rgba(170,140,255,.4);color:#e2d8ff;font-size:14px}
.sheet p.note{padding:10px 12px;border-radius:10px;background:rgba(116,228,255,.06);box-shadow:inset 3px 0 0 rgba(116,228,255,.5);color:var(--ink2);font-size:14px}
.lrow.sel{background:rgba(116,228,255,.12);box-shadow:inset 0 0 0 1px rgba(116,228,255,.55)}
.lrow b{display:block;font:700 16px var(--sans)}
.lrow small{display:block;font-size:13px;color:var(--ink3)}
.lrow .end{margin-left:auto;text-align:right;flex:none}
.lrow .it{--s:52px}
.afrow{display:grid;grid-template-columns:1fr 24px 1fr;align-items:center;gap:8px;padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.04)}
.afrow+.afrow{margin-top:8px}
.afrow .c{color:#ffc0cb} .afrow .g{color:#ffe2a3} .afrow .to{color:var(--ink3)}
.afrow .note{grid-column:1/-1;font-size:13px;color:var(--ink3)}
.afrow .note.warn{color:#ffd0a6}
.afrow .note.ok{color:#c8f7dc}
.toast{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);z-index:60;padding:12px 20px;border-radius:12px;background:rgba(14,22,48,.92);border:1px solid var(--line2);font-size:14px;display:none}
.toast.on{display:flex;align-items:center;gap:14px}
.toast .tundo{height:28px;padding:0 12px;border-radius:8px;background:rgba(116,228,255,.14);box-shadow:inset 0 0 0 1px rgba(116,228,255,.45);color:#d2f8ff;font-weight:700;font-size:13px}
</style>

<style>
/* ================= 队伍卡（照搬 regionalScreen.css 的 rg-troop，数字 Georgia、图标与战斗卡同款） ================= */
.rg-troop{position:relative;display:flex;flex-direction:column;padding:0;border:1px solid #b29d6966;border-radius:8px;overflow:hidden;background:#0c1822;box-shadow:0 5px 16px #0004;transition:border-color .15s,box-shadow .15s;text-align:left;color:inherit}
.rg-troop:hover{border-color:#e4c787;box-shadow:0 0 0 1px #e4c78755,0 7px 20px #0005}
.rg-troop-art{position:relative;flex:1;min-height:0;overflow:hidden;isolation:isolate}
.rg-troop-art>img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 22%}
.rg-portrait-stats{position:absolute;inset:0;container-type:inline-size;pointer-events:none;background:linear-gradient(180deg,#06101c33,transparent 28%,transparent 50%,#06101cbe)}
.rg-stat{position:absolute;display:flex;align-items:center;gap:4px;color:#f3dfb0;text-shadow:0 2px 3px #000,0 0 6px #000}
.rg-stat b{font:bold clamp(18px,7.5cqw,28px)/1 Georgia,serif}
.rg-stat svg{width:clamp(16px,7cqw,25px);height:clamp(16px,7cqw,25px);flex:none}
.rg-stat-mana{left:0;top:0;width:clamp(29px,23cqw,50px);aspect-ratio:1;padding:clamp(2px,2cqw,5px);background:linear-gradient(135deg,rgba(20,18,15,.74),rgba(11,10,9,.6));border:1px solid rgba(216,194,144,.5);border-radius:8px 0 12px 0;box-shadow:1px 1px 4px #0008}
.rg-stat.rg-stat-mana>svg{display:block;width:100%;height:100%;overflow:visible;filter:drop-shadow(0 1px 2px #000d)}
.board-gem .seat{fill:rgba(11,10,9,.25)} .board-gem .facets{fill:none;stroke:rgba(255,255,255,.22);stroke-width:5}
.rg-gem-mana{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;white-space:nowrap;font:800 clamp(11px,8cqw,23px)/1 Georgia,serif;color:rgba(243,234,214,.72);text-shadow:1px 0 #0a0806,-1px 0 #0a0806,0 1px #0a0806,0 -1px #0a0806,0 1px 3px #000}
.rg-gem-mana small{font-size:.72em;font-weight:700}
.rg-stat-magic{top:0;right:0;padding:7px 9px;background:#2c1d39d9;border-radius:0 0 0 12px;color:#e5d1ff}
.rg-stat-attack{bottom:12px;left:10px}
.rg-stat-armor{bottom:48px;right:10px;color:#dae4e9;flex-direction:row-reverse}
.rg-stat-hp{bottom:12px;right:10px;color:#ff999b;flex-direction:row-reverse}
.rg-troop-caption{flex:none;display:grid;grid-template-columns:minmax(0,1fr) auto;align-content:center;column-gap:8px;min-height:58px;padding:7px 12px;border-top:2px solid var(--rc,#b29d6940);background:linear-gradient(120deg,#192833,#0c1822)}
.rg-troop-caption h3{margin:0;font:17px/1.35 "Palatino Linotype","STZhongsong","Noto Sans SC",serif;color:#efdeb7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rg-troop-caption small{grid-column:1;margin-top:2px;font-size:12px;color:#a99870}
.rg-troop-caption>span{grid-column:2;grid-row:1/3;align-self:center;font:22px Georgia,serif;color:#a99870}
.sheet .rg-troop-caption>span{visibility:hidden}
.rg-troop.r0{--rc:#aab2ad} .rg-troop.r1{--rc:#4caf6a} .rg-troop.r2{--rc:#9a4fd4} .rg-troop.r3{--rc:#ffe24a} .rg-troop.r4{--rc:#c56b2d} .rg-troop.r5{--rc:#56d8ff}
</style>

<style>
/* ================= 营地 ================= */
#camp .bg{background-image:url(../../game-assets/bundled/meta/expedition/anime/camp.webp);background-position:50% 46%}
#camp .shade{background:linear-gradient(90deg,rgba(14,20,50,.5) 0,rgba(14,20,50,.1) 30%,transparent 50%,rgba(14,20,50,.14) 70%,rgba(14,20,50,.46) 100%),linear-gradient(180deg,rgba(14,20,50,.42) 0,transparent 16%)}
.snow{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.snow i{position:absolute;top:-10px;width:4px;height:4px;border-radius:50%;background:#fff;opacity:.7;animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),920px)}}
@media (prefers-reduced-motion:reduce){.snow{display:none}}
.rank{left:40px;top:104px;width:380px;padding:20px 22px 20px}
.rank .r{display:flex;align-items:center;gap:14px}

.act-dock{position:absolute;right:24px;bottom:22px;display:flex;gap:10px;z-index:5}
.ab{position:relative;width:76px;height:76px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:var(--panel);border:1px solid var(--line);backdrop-filter:blur(14px);font-size:13px;color:var(--ink2)}
.ab:hover{border-color:rgba(205,222,255,.5);color:var(--ink)}
.ab img{width:38px;height:38px;object-fit:contain}
.ab .n{position:absolute;right:6px;top:5px;min-width:22px;height:20px;padding:0 6px;border-radius:99px;background:#24305e;font:600 12px/20px var(--num);color:#fff;text-align:center}
.ab[disabled]{opacity:.45;cursor:not-allowed}
.ab.wide{width:auto;padding:0 18px;flex-direction:row;gap:10px;font-size:14px}
.ab.wide b{font:700 15px var(--sans);color:var(--ink)}
.ab.wide small{display:block;font-size:13px;color:var(--ink3)}

/* 左上菜单：从按钮下方展开，不再借用右侧抽屉 */
.menu-pop{position:absolute;left:24px;top:84px;z-index:9;width:300px;padding:8px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);backdrop-filter:blur(16px);box-shadow:0 16px 40px rgba(8,12,40,.4);animation:drop .14s ease-out}
.menu-pop .lrow{background:none}
.menu-pop .lrow:hover{background:rgba(255,255,255,.08)}
@keyframes drop{from{transform:translateY(-6px);opacity:0}}

/* 节点浮窗：只回答"这是什么、去要几步" */
.pop{position:absolute;z-index:8;width:300px;padding:16px 18px;border-radius:12px;background:var(--panel);border:1px solid var(--line2);backdrop-filter:blur(16px);box-shadow:0 16px 40px rgba(8,12,40,.4);display:none}
.pop.on{display:block}
.pop .h{display:flex;align-items:center;gap:12px}
.pop .h img{width:48px;height:48px;object-fit:contain}
.pop .h b{display:block;font:700 18px var(--sans)}
.pop .h small{font-size:13px;color:var(--ink3)}
.pop p{margin:10px 0 0;font-size:14px;color:var(--ink2)}
.pop .acts{display:flex;gap:8px;margin-top:14px}
.pop .acts .primary{flex:1;height:46px;font-size:16px;padding:0 16px}
.pop .acts .btn{height:46px}
/* 只有一个常规按钮时不拉满整条，靠右，读完再点；撤离按钮保持整条（C04） */
.pop .acts .primary:only-child:not(.exit){flex:0 0 auto;min-width:132px;height:42px;margin-left:auto}
.pop .h small{display:block}
.pop .h small.k{font:600 14px var(--sans);color:var(--ink2)}
.pop .h small.k.danger{color:#ffb3c0}
.pop .h .herep{margin-left:8px;vertical-align:2px;height:20px;font-size:12px}

/* ================= 遭遇预览 ================= */
.modal{position:absolute;inset:0;z-index:30;display:none;background:rgba(8,12,34,.4);backdrop-filter:blur(3px)}
.modal.on{display:grid;place-items:center}
.enc{position:relative;width:1180px;padding:26px 30px 26px;border-radius:24px;background:linear-gradient(180deg,rgba(34,44,92,.95),rgba(22,30,68,.97));border:1px solid var(--line2);box-shadow:0 30px 80px rgba(4,8,28,.55)}
.enc .hd{display:flex;align-items:center;gap:14px}
.enc .hd h2{margin:0;font:900 28px var(--sans)}
.enc .hd .x{margin-left:auto;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink2)}
.enc .hd .x:hover{background:rgba(255,255,255,.1)}
.foes{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:20px}
.foe{display:flex;flex-direction:column;gap:10px}
.foe .rg-troop{height:380px}
.foe .rk{font-size:13px;color:var(--ink3)}
.afs{display:flex;flex-wrap:wrap;gap:6px;min-height:26px}
.enc{border-radius:18px}
.enc .hd .ph{font:600 16px var(--sans);color:var(--ink2)}
.enc .hd .where{font-size:14px;color:var(--ink3)}
/* 建议条：左边一道青色竖线，不用网页式的 ⓘ 提示条 */
.enc .tip{margin-top:20px;padding:12px 16px;border-radius:10px;background:rgba(116,228,255,.06);box-shadow:inset 3px 0 0 rgba(116,228,255,.5);font-size:14px;color:var(--ink2)}
.enc .tip .how{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:15px}
.enc .tip .how>span:first-child{color:var(--ink3)}
.enc .tip .how b{color:var(--cy);font-weight:700}
.enc .tip .tx{margin-top:4px;font-size:13px;color:var(--ink3)}
.enc .tip .tx:empty{display:none}
.enc .ft{display:flex;align-items:center;gap:12px;margin-top:18px}
.enc .ft .rw{display:flex;align-items:center;gap:14px;font-size:15px;color:var(--ink)}
.enc .ft .rw>small{font-size:13px;color:var(--ink3)}
.enc .ft .rwi{display:flex;align-items:center;gap:8px}
.enc .ft .rwi b{font-weight:700}
.enc .ft .rwi small{font-size:12px;color:var(--ink3)}
.enc .ft .primary small,.pop .primary small{display:inline}
.pop .primary small em.tide,.enc .primary small em.tide{font-style:normal;color:#5a3aa8;margin-left:4px}
.ab.ping{animation:abping .8s 1}
@keyframes abping{50%{box-shadow:0 0 0 3px rgba(255,112,136,.7)}}
.enc .ft .rw b{color:var(--gold)}
.enc .ft .sp{flex:1}
</style>
</head>

    sum.set(k, (sum.get(k) || 0) + +m[2]);
  }));
  const parts = [...sum].map(([k, v]) => (k.endsWith('%') ? `${k.slice(0, -1)} +${v}%` : `${k} +${v}`));

<script>
'use strict';
/* ================= 局内地图：数据全部来自 expedition_mapgen.js，种子决定结构和房间 ================= */
const G = window.ExpeditionMapGen;
const TYPES = {
  entry:    { nm: '入口', icon: 'node-extract', nc: '#9fd8c8', d: '你从这里下来。' },
  exit:     { nm: '撤离点', icon: 'node-extract', nc: '#72e6a8' },
  supply:   { nm: '补给箱', icon: 'node-supply', nc: '#9fd8c8', d: '局内素材和消耗品。', loot: 1 },
  loot:     { nm: '战利品堆', icon: 'node-loot', nc: '#ffcf6b', d: '2–3 件物品，可能有刻印。', loot: 1 },
  chest:    { nm: '上锁宝箱', icon: 'node-chest', nc: '#ffcf6b', d: '至少 1 件稀有以上。徒手撬锁比较费时，用撬锁器很快。', loot: 2, slow: 1 },
  ore:      { nm: '矿脉', icon: 'node-ore', nc: '#74e4ff', d: '记忆碎片和刻尘。', loot: 1 },
  guard:    { nm: '驻守敌人', icon: 'node-wander', nc: '#ff7088', d: '不会移动，不想打可以绕路。', fight: 1 },
  nest:     { nm: '稀有怪巢', icon: 'node-nest', nc: '#b892ff', d: '稀有怪物群，胜利后遗物三选一。', fight: 1 },
  lord:     { nm: '领主巢', icon: 'node-lord', nc: '#ffc145', d: '多阶段领主，必掉传说以上刻印。', fight: 1 },
  boss:     { nm: '首领殿', icon: 'node-boss', nc: '#ff5a74', d: '群系首领。胜利后开启首领传送门。', fight: 1 },
  camp:     { nm: '营火', icon: 'node-fire', nc: '#ffa25a', d: '休整、侦察或整备，三选一。都比较费时。' },
  shrine:   { nm: '神龛', icon: 'node-shrine', nc: '#ffe6a8', d: '两个祝福选一个。' },
  merchant: { nm: '行商', icon: 'node-merchant', nc: '#ffcf6b', d: '用钱袋买卖。' },
  altar:    { nm: '血祭祭坛', icon: 'node-altar', nc: '#ff5a74', d: '祭坛和相邻房间里打过的敌人会记入名单。' },
  coffin:   { nm: '冰封棺', icon: 'node-coffin', nc: '#a8dcff', d: '砸开冰层会惊醒里面的东西，必定开战，赢了拿走棺中的箱子。', fight: 1 },
};
// 层名来自生成器（群系的分层主题），例如"第二层 · 极光冰窟"
const layerOf = (n) => { const L = MAP.layers[n.ring] || MAP.layers.outer; return `${L.no} · ${L.nm}`; };
const BAG0 = [['use-smoke', 1], ['cur-reroll', 2], ['sigil-stone', 1], ['sigil-iron', 0], ['cur-quality', 3], ['mat-soul', 2], ['cur-dust', 0, 8], ['sigil-silver', 1], ['mat-purse', 0]].map(([icon, r, q]) => ({ icon, r, q }));
const ekey = (u, v) => (u < v ? u + '|' + v : v + '|' + u);
let MAP, S, ADJ;

function newRun(seed, runType) {
  MAP = G.generate({ seed, runType, compasses: ['blood', 'rival'], tier: 6 });
  MAP.byId = Object.fromEntries(MAP.nodes.map((n) => [n.id, n]));
  ADJ = {}; MAP.nodes.forEach((n) => (ADJ[n.id] = []));
  MAP.edges.forEach((e) => { ADJ[e.u].push(e.v); ADJ[e.v].push(e.u); e.k = ekey(e.u, e.v); });
  const altar = MAP.nodes.find((n) => n.t === 'altar');
  MAP.altarRange = new Set(altar ? [altar.id, ...ADJ[altar.id]] : []);
  // 开局可见：入口、撤离点（规划路线用）、首领殿、罗盘事件
  const known = new Set([MAP.entry, 'boss', ...MAP.exits.map((x) => x.node), ...MAP.events.filter((e) => e.core).map((e) => e.core)]);
  // step 只在后台记（服务端），界面上不出现；玩家看到的是冰潮封了哪些区域、下一次要封哪些
  S = { cur: MAP.entry, prev: null, visited: new Set([MAP.entry]), known, walked: new Set(), step: 0, tide: 0, sealed: new Set(), lives: 3, smoke: 1, potions: 2, sel: null,
    cleared: new Set(), looted: new Set(), list: 0, hp: [100, 100, 100, 100], bag: BAG0.map((x) => ({ ...x })), patrol: MAP.patrols.map((p) => ({ ...p, pos: 0 })), quiet: true,
    tideLog: [], whisper: -1, seenRing: new Set([MAP.byId[MAP.entry].ring]), over: null,
    relics: [{ nm: '霜心', d: '冻结的敌人受到骷髅伤害 +15%', icon: 'cur-quality', r: 2 }, { nm: '旅人斗篷', d: '营火休整时多回复 20% 生命', icon: 'mat-soul', r: 1 }] };
  scout();
  // 开场先走两步，地图上能看出走过的路
  const r = path(S.cur, MAP.exits[0].node);
  for (let i = 1; i < r.length && i <= 2; i++) { if (isFight(MAP.byId[r[i]])) break; moveOne(r[i]); }
  S.quiet = false;
  $('#rBiome').textContent = '霜渊'; $('#seed').value = seed; $('#rtype').value = runType;
  $$('#segRun [data-rt]').forEach((b) => b.classList.toggle('on', b.dataset.rt === runType));
  $('#rtHint').textContent = runType === 'short' ? '区域少，冰潮涨得快' : '区域多，冰潮涨得慢';
  clearTimeout(tidecast.h); $('#tidecast').classList.remove('on');
  hidePop(); renderRun();
}
const eff = (n) => (n.t === 'guard' && S.cleared.has(n.id) ? 'loot' : n.t);
const isFight = (n) => !!(TYPES[eff(n)] || {}).fight && !S.cleared.has(n.id);
const hasLoot = (n) => !!(TYPES[eff(n)] || {}).loot && !S.looted.has(n.id);
// 最短路线不穿过已经被冰潮封住的区域；找不到就返回 [from]
function path(from, to) {
  const prev = { [from]: null }, q = [from];
  while (q.length) { const u = q.shift(); if (u === to) break; for (const v of ADJ[u]) if (!(v in prev) && !S.sealed.has(v)) { prev[v] = u; q.push(v); } }
  if (!(to in prev)) return [from];
  const out = []; for (let c = to; c != null; c = prev[c]) out.unshift(c); return out;
}
// 走进一个区域就能看清相邻区域里有什么（不再有灯火）
function scout() { ADJ[S.cur].forEach((v) => S.known.add(v)); }
function moveOne(to) {
  S.walked.add(ekey(S.cur, to)); S.prev = S.cur; S.cur = to; S.visited.add(to); S.known.add(to);
  S.patrol.forEach((p) => { if (!p.dead) p.pos = (p.pos + 1) % p.route.length; });
  scout();
  const n = MAP.byId[to];
  // 第一次走进更深的一层：轻提示层名（地图本身靠崖边和色调表示"往下走"）
  const firstRing = !S.seenRing.has(n.ring); S.seenRing.add(n.ring);
  spend(1);
  if (S.quiet || S.cur !== to) return;
  if (!lastLeg() && tideNext(to)) tidecast('这里下一次冰潮会被封住', '', { lite: 1, ms: 2400 });
  else if (firstRing && !$('#tidecast').classList.contains('on')) tidecast(`进入${layerOf(n)}`, '', { lite: 1, ms: 2200 });
}
const patrolAt = (id) => S.patrol.find((p) => !p.dead && p.route[p.pos] === id);
const exitOpen = (n) => n.exit && S.step >= n.exit.win[0] && !S.sealed.has(n.id);
// 下一次冰潮要封的区域
const tideNext = (id) => MAP.tide.seal[id] === S.tide + 1 && !S.sealed.has(id);

/* ---------- 后台计时与冰潮 ----------
   每个动作花的时间（移动 1、搜刮 1–2、战斗 2、营火 3……）只累计在 S.step，不显示。
   跨过 tide.every 的整数倍时冰潮上涨：封住这一次的区域，在顶部播报，并把下一次要封的区域标出来。
   你站的区域被封：全队被冰潮推到最近的通路区域，损失 15% 生命。最后一次冰潮时还在图里 = 失败。
   玩家看到的时间线索全都不是数字（v4 审稿 F）：
   - 下一次冰潮还有多久：将封区域的冰从边缘往里长（tideNear），最后一两步虚线加快、提示"脚下的冰在响"；
   - 整局还剩多久：地图外圈的霜带每次涨潮加宽（tideFrac）；播报用"漫过林地 / 漫进冰窟 / 只剩最后一次"这类阶段话。 */
const tideNear = () => (S.tide >= MAP.tide.count ? 1 : Math.min(1, (S.step % MAP.tide.every) / MAP.tide.every));
const tideSoon = () => tideNear() >= 2 / 3;
const lastLeg = () => S.tide >= MAP.tide.count - 1;
const tideFrac = () => S.sealed.size / MAP.nodes.length;
// 某个动作做完会不会让冰潮涨（给按钮写"打完冰潮会上涨"，不写步数）
const tideIn = (k) => S.tide < MAP.tide.count && S.step + k >= (S.tide + 1) * MAP.tide.every;
// 最后一个还开着的撤离点（最后一个间隔里标"最后的出路"）
const lastExit = () => MAP.exits.map((x) => MAP.byId[x.node]).filter((n) => !S.sealed.has(n.id)).sort((a, b) => MAP.tide.seal[b.id] - MAP.tide.seal[a.id])[0];
function spend(n) {
  S.step += n;
  while (S.tide < MAP.tide.count && S.step >= (S.tide + 1) * MAP.tide.every) riseTide();
  // 快涨了：每个间隔只说一次
  if (!S.quiet && S.tide < MAP.tide.count && tideSoon() && S.whisper !== S.tide) {
    S.whisper = S.tide;
    if (!$('#tidecast').classList.contains('on')) tidecast('脚下的冰在响，冰潮快涨了', '', { lite: 1, ms: 2400 });
  }
}
function riseTide() {
  S.tide++;
  const now = MAP.nodes.filter((n) => MAP.tide.seal[n.id] === S.tide);
  now.forEach((n) => S.sealed.add(n.id));
  S.fresh = new Set(now.map((n) => n.id)); // 这一帧播一次封冻动画
  S.patrol.forEach((p) => { if (!p.dead && S.sealed.has(p.route[p.pos])) p.dead = true; }); // 巡逻的敌人也被封在冰里
  const log = { k: S.tide, places: now.map((n) => n.place), pushed: '' };
  S.tideLog.push(log);
  if (S.tide >= MAP.tide.count) { S.over = 'fail'; tidecast('冰潮吞没了整座霜渊', '最后一次冰潮之前没能撤离 → 失败结算页（原型略）', { ms: 6000 }); return; }
  let pushed = '';
  if (S.sealed.has(S.cur)) {
    // 推到最近的开放区域；同样近的几个里，优先挑不在下一批、没有巡逻敌人、直线更近的
    const from = S.cur, dist = { [from]: 0 }, prev = { [from]: null }, q = [from], cands = [];
    let best = Infinity;
    while (q.length) {
      const u = q.shift(); if (dist[u] >= best) continue;
      for (const v of ADJ[u]) if (!(v in dist)) { dist[v] = dist[u] + 1; prev[v] = u; if (S.sealed.has(v)) q.push(v); else { cands.push(v); best = Math.min(best, dist[v]); } }
    }
    const a = MAP.byId[from], score = (v) => (tideNext(v) ? 2 : 0) + (patrolAt(v) ? 1 : 0) + Math.hypot(MAP.byId[v].x - a.x, MAP.byId[v].y - a.y) / 1e4;
    const to = cands.filter((v) => dist[v] === best).sort((x, y) => score(x) - score(y))[0];
    if (to) {
      const trail = []; for (let c = to; c != null; c = prev[c]) trail.unshift(c);
      S.cur = to; S.known.add(to); scout();
      S.hp = S.hp.map((v) => Math.max(5, Math.round(v * 0.85)));
      S.pushAnim = viaDoors(trail); S.pushedTo = to; S.hpHit = true;
      pushed = `你被冰潮推到了${MAP.byId[to].place}，全队损失 15% 生命`;
      log.pushed = MAP.byId[to].place;
    }
  }
  if (S.quiet) return;
  // 标题只写结果；封得多就不列名单，地名交给地图上的封冻动画
  const title = !now.length ? '冰潮涨了一截，还没漫到路上'
    : now.length <= 2 ? `冰潮上涨，${now.map((n) => n.place).join('、')}被冰封` : '冰潮上涨，又封住了一片';
  // 副标题只写一句最有用的：被推开 > 撤离点被封 > 阶段话 > 下一批在哪
  const exitGone = now.filter((n) => n.exit).map((n) => `撤离 ${n.exit.id} 被封住了`)[0];
  const L = MAP.layers, last = lastExit();
  const stage = S.tide === MAP.tide.count - 1 ? `只剩最后一次冰潮了。${last ? `撤离 ${last.exit.id} 是最后的出路` : ''}`
    : now.some((n) => n.ring === 'mid') && !S.tideLog.slice(0, -1).some((l) => l.mid) ? (log.mid = 1, `冰潮漫进了${L.mid.nm}`)
    : S.tide <= 2 ? `冰潮漫过了${L.outer.nm}的边缘` : '';
  const hint = '紫色虚线圈住的是下一批';
  if (!now.length) { tidecast(title, '', { lite: 1, ms: 2400 }); return; }
  if (pushed) {
    tidecast(title, pushed, { ms: 5000, then: () => tidecast(exitGone || stage || hint, '', { lite: 1, ms: 2600 }) });
  } else tidecast(title, exitGone || stage || hint, { ms: 3400 });
}
// 播报：o.lite 是单行轻量样式；o.then 播完接下一条；遭遇窗口打开期间不自动消失
function tidecast(title, sub, o = {}) {
  const t = $('#tidecast'); t.querySelector('b').textContent = title; t.querySelector('span').textContent = sub || '';
  t.classList.toggle('lite', !!o.lite); t.classList.add('on'); clearTimeout(tidecast.h);
  const done = () => {
    if ($('#encounter').classList.contains('on')) { tidecast.h = setTimeout(done, 1000); return; }
    t.classList.remove('on'); if (o.then) setTimeout(o.then, 300);
  };
  tidecast.h = setTimeout(done, o.ms || 3400);
}

/* ---------- 绘制：《黑色幸存者》式区域图 ----------
   底图（地形、道路、石墙、地貌）由 expedition_terrain.js 按种子画在 canvas 上，开局画一次；
   这里的 SVG 只画会变的东西：区域状态（迷雾 / 当前 / 可去 / 选中）、地名、类型标记、走过的路、路线预览、头像。 */
const GLYPH = {
  fight: 'M5 19 19 5M14 5h5v5M19 19 5 5M5 10V5h5',
  lord: 'M4 17h16l-1.5-9-4 3.5L12 5l-2.5 6.5-4-3.5z',
  boss: 'M12 3a7 7 0 0 0-7 7c0 2.6 1.4 4.3 3 5.2V19h8v-3.8c1.6-.9 3-2.6 3-5.2a7 7 0 0 0-7-7zM9.5 10.5h.01M14.5 10.5h.01M10 19v-2M14 19v-2',
  nest: 'M6 19c2.2-4.4 2.2-9.4 1-14M12 20c1-5 1-10.4 0-16M18 19c-2.2-4.4-2.2-9.4-1-14',
  loot: 'M8 7h8l2.5 12h-13zM9.5 7a2.5 2.5 0 0 1 5 0',
  chest: 'M4 10h16v9H4zM4 10a4 4 0 0 1 4-4h8a4 4 0 0 1 4 4M11 12.5h2v3h-2z',
  supply: 'M4 7h16v12H4zM4 7l8 5 8-5M12 12v7',
  ore: 'M12 3l5 6-5 12-5-12zM7 9h10',
  camp: 'M12 3c3 4 5 6.2 5 10a5 5 0 0 1-10 0c0-2 1-3.2 2-4 0 1.8 1 3 2 3 0-4-1-6 1-9zM6 21h12',
  shrine: 'M12 3l2.2 4.5h-4.4zM8 21h8M10 21V9h4v12',
  merchant: 'M12 4a8 8 0 1 0 .01 0zM9 10h6M9 14h6M12 7v10',
  altar: 'M12 3c3 5 6 8 6 11a6 6 0 0 1-12 0c0-3 3-6 6-11z',
  coffin: 'M9 3h6l3 6-3 12H9L6 9zM10 9h4M12 7v5',
  exit: 'M14 4h5v16h-5M10 8l-4 4 4 4M6 12h10',
  entry: 'M6 21V4M6 4h11l-2 4 2 4H6',
};
// 类型 → [图形, 主色, 是否实心]。v4 审稿 G10：大多数是"深底 + 彩色线框图形"，只有撤离和首领用实心，拉开层级
const BADGE = {
  entry: ['entry', '#c9d4f0'], exit: ['exit', '#72e6a8', 1], supply: ['supply', '#9cc8ec'], loot: ['loot', '#ffcf6b'],
  chest: ['chest', '#ffb35a'], ore: ['ore', '#7fd8f0'], guard: ['fight', '#ff8fa3'], nest: ['nest', '#c9a8ff'],
  lord: ['lord', '#f2b640'], boss: ['boss', '#ff7088', 1], camp: ['camp', '#ff9f5a'], shrine: ['shrine', '#f3e2b0'],
  merchant: ['merchant', '#9fe3c4'], altar: ['altar', '#e86a9a'], coffin: ['coffin', '#a8dcff'],
};
const SVGNS = 'http://www.w3.org/2000/svg';
const cellPath = (n) => 'M' + n.cell.map((p) => p.join(' ')).join('L') + 'Z';
// 没探明：不画问号圆，只画两道雾纹，比已知标记安静（G12）
const mistMark = (x, y) => `<g transform="translate(${x} ${y})" pointer-events="none" opacity=".8"><path d="M-6 -2.5q3-3 6 0t6 0M-6 2.5q3-3 6 0t6 0" fill="none" stroke="#c9d2e8" stroke-width="1.6" stroke-linecap="round"/></g>`;
const LOCK = (fg) => `<path d="M-4 -1v-2a4 4 0 0 1 8 0v2M-5 -1h10v6h-10z" fill="none" stroke="${fg}" stroke-width="1.6" stroke-linejoin="round"/>`;
function badge(x, y, t, opt = {}) {
  const r = opt.r || 15, s = (r * 1.15) / 24; // 图形大小跟着圆走（G11）
  // 标记不接收点击，点在标记上等于点它所在的区域
  if (!t) return r > 12 ? `<g transform="translate(${x} ${y})" pointer-events="none"><circle r="${r}" fill="rgba(16,22,52,.6)" stroke="rgba(201,210,232,.5)" stroke-dasharray="3 3"/><g transform="scale(${r / 9})">${mistMark(0, 0)}</g></g>` : mistMark(x, y);
  if (t === 'sealed') return `<g transform="translate(${x} ${y})" pointer-events="none"><circle r="${r}" fill="#7d6cd8"/><g transform="scale(${r / 11})">${LOCK('#fff')}</g></g>`;
  const [gl, c, solid] = BADGE[t] || BADGE.supply;
  const fill = solid ? c : 'rgba(16,22,52,.92)', fg = solid ? '#13203a' : c;
  return `<g transform="translate(${x} ${y})" pointer-events="none" opacity="${opt.dim ? 0.5 : 1}"><circle r="${r}" fill="${fill}" stroke="${c}" stroke-width="${solid ? 0 : 1.5}" stroke-opacity=".85"/>`
    + `<g transform="translate(${-12 * s} ${-12 * s}) scale(${s})"><path d="${GLYPH[gl]}" fill="none" stroke="${fg}" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></g></g>`;
}
// 文字宽度估算（中文 14px ≈ 14，其余 ≈ 7.8）
const textW = (s, cn = 14, en = 7.8) => [...String(s)].reduce((w, ch) => w + (/[\u3000-\u9fff\uff00-\uffef]/.test(ch) ? cn : en), 0);
// 地名牌：深色玻璃底 + 左侧类型标记 + 地名，挂在地标贴图下方。没探明的牌子降一级：半透明、虚线边、字更轻
function plate(n, known, t, spent) {
  const sealed = S.sealed.has(n.id), boss = n.t === 'boss';
  const w = textW(n.place) + (known || sealed ? 46 : 40), y = n.y + 34;
  const bg = sealed ? 'rgba(236,234,255,.92)' : boss ? 'rgba(110,26,58,.9)' : known ? 'rgba(18,26,58,.84)' : 'rgba(18,26,58,.6)';
  const stroke = sealed ? 'rgba(125,108,216,.7)' : boss ? 'rgba(255,170,190,.55)' : 'rgba(205,222,255,.35)';
  const dash = known || sealed ? '' : ' stroke-dasharray="4 3"';
  const mark = `<g transform="translate(${-w / 2 + 16} 0)">${badge(0, 0, sealed ? 'sealed' : n.exit && known ? 'exit' : t, { dim: spent, r: 11 })}</g>`;
  return `<g class="plate${known ? '' : ' fog'}${sealed ? ' sealed' : ''}" transform="translate(${n.x} ${y})" pointer-events="none">
    <rect x="${-w / 2}" y="-14" width="${w}" height="28" rx="14" fill="${bg}" stroke="${stroke}"${dash}/>${mark}
    <text x="${-w / 2 + (known || sealed ? 34 : 28)}" y="5">${esc(n.place)}</text></g>`;
}
function pill(x, y, text, fg, bg, extra = '') {
  const w = textW(text, 13, 7.6) + 22;
  return `<g transform="translate(${x} ${y})" pointer-events="none"${extra}><rect x="${-w / 2}" y="-11" width="${w}" height="22" rx="11" fill="${bg}" stroke="rgba(255,255,255,.35)"/><text y="4.5" text-anchor="middle" font-family="Noto Sans SC" font-size="12.5" font-weight="700" fill="${fg}">${esc(text)}</text></g>`;
}
// 撤离点状态只写玩家能直接读懂的（不写步数）：稍后开放 / 可撤离 / 冰潮将至 / 快封了 / 最后的出路 / 已封闭

  if (S.pushedTo === n.id) { desc = '你被冰潮推到了这里。' + desc; S.pushedTo = null; }
  if (pat && known) desc += ` 游荡的${pat.enemy}正在这里。`;
  if (!sealed && !n.exit && !lastLeg() && tideNext(n.id)) desc += ' 下一次冰潮会封住这里。';
  if (!here && dist >= 2) desc += ' 路上遇到敌人会停下。';
  if (MAP.altarRange.has(n.id) && known && n.t !== 'altar' && isFight(n)) desc += ' 在祭坛范围内，打过会记入名单。';

    <div><b>${esc(n.place)}${here ? '<span class="tag cy herep">你在这里</span>' : ''}</b><small class="k${danger ? ' danger' : ''}">${esc(kind)}</small>${otherLayer ? `<small>在${layerNo(n)}</small>` : ''}</div></div>
    <p>${esc(desc.trim())}</p>${acts ? `<div class="acts">${acts}</div>` : ''}`;
  pop.classList.add('on');
  // 选位：不出屏；不盖住头像、首领殿、也不盖住这条路线经过的区域（C01）；先试和路线方向相反的一侧
  const R = 70, ry = 34, ph = pop.offsetHeight || 200, W = 300;
  const midY = Math.max(96, Math.min(820 - ph, n.y - 90)), midX = Math.max(24, Math.min(1276, n.x - W / 2));
  const from = MAP.byId[route[route.length - 2] ?? n.id], right = n.x - from.x >= 0 || n.x < MAP.center[0];
  const side = [[n.x + R + 22, midY], [n.x - R - 22 - W, midY]];
  const cand = (right ? side : side.reverse()).concat([[midX, n.y + ry + 18], [midX, n.y - ry - 70 - ph], [n.x + R, n.y + ry + 18], [n.x - W - R, n.y - ph - 40]]);
  const c = MAP.byId[S.cur], boss = MAP.byId.boss, avoid = route.map((id) => MAP.byId[id]).filter((m) => m.id !== n.id);
  const hits = (x, y, px, py, pad) => px > x - pad && px < x + W + pad && py > y - pad && py < y + ph + pad;
  const fits = ([x, y]) => x >= 24 && x <= 1276 && y >= 96 && y + ph <= 830;
  const base = ([x, y]) => !(n.id !== S.cur && hits(x, y, c.x, c.y - 30, 34)) && !(n.id !== 'boss' && hits(x, y, boss.x, boss.y, 90));
  const clean = (p) => base(p) && !avoid.some((m) => hits(p[0], p[1], m.x, m.y, 40));
  const loose = (p) => base(p) && !avoid.slice(-2).some((m) => hits(p[0], p[1], m.x, m.y, 40));
  const [x, y] = cand.find((p) => fits(p) && clean(p)) ?? cand.find((p) => fits(p) && loose(p)) ?? cand.find(fits) ?? cand[0];

}
function act(a, n) {
  if (a === 'go') return travel(n.id);
  if (a === 'peek') return openEncounter(n, { peek: true });
  if (a === 'room' || a === 'loot') return roomSheet(n);
  if (a === 'exit') return exitSheet(n);
}
function travel(to) {
  const r = path(S.cur, to);
  for (let i = 1; i < r.length; i++) {
    // 半路涨潮：前面的区域被封、或者人被推走了，就停下重新规划
    if (S.sealed.has(r[i]) || !ADJ[S.cur].includes(r[i])) { S.sel = to; renderRun(); return showPop(MAP.byId[to]); }
    moveOne(r[i]);
    if (S.cur !== r[i]) { S.sel = null; renderRun(); return showPop(MAP.byId[S.cur]); } // 这一步被冰潮推走了
    const n = MAP.byId[r[i]], pat = patrolAt(r[i]);
    if (pat) { S.sel = null; hidePop(); renderRun(); return openEncounter(n, { patrol: pat }); }
    if (isFight(n)) { S.sel = null; hidePop(); renderRun(); return openEncounter(n, {}); }
  }
  select(to);
}

    const nest = nests.filter((n) => !S.cleared.has(n.id) && S.known.has(n.id)).sort((a, b) => path(S.cur, a.id).length - path(S.cur, b.id).length)[0];
    sheet('本趟事件', '插在地图台上的罗盘带来的', `<div class="lrow"><img src="${ico('node-altar')}" alt="" style="width:52px;height:52px"><span><b>血祭</b><small>${found ? `名单上有 ${S.list} 个敌人，满 4 个可以激活祭坛` : '祭坛还没找到'}</small></span><button class="end btn sm" data-pick="${found ? altar.id : ''}"${found ? '' : ' disabled'}>${found ? '在地图上看' : '还没找到'}</button></div>
      <div class="lrow"><img src="${ico('node-nest')}" alt="" style="width:52px;height:52px"><span><b>劲敌</b><small>${done ? `稀有怪巢打掉 ${done} 个，还剩 ${nests.length - done} 个` : `这张图多了 2 个稀有怪巢，一共 ${nests.length} 个`}</small></span><button class="end btn sm" data-pick="${nest ? nest.id : ''}"${nest ? '' : ' disabled'}>${nest ? '在地图上看' : '还没找到'}</button></div>`);
    $$('#shB [data-pick]').forEach((b) => (b.onclick = () => { if (!b.dataset.pick) return; closeSheet(); select(b.dataset.pick); }));
  },
});

/* ---------- 遭遇预览 ---------- */
const AFFIX = G.AFFIX;
const RAR = (u) => (u.lead ? (u.rarity >= 4 ? 4 : 3) : u.rarity);
// 游荡敌人的掉落：按种子在第一次见到时定下来，预览和结算用同一份，结算页不重新抽
const DROP_POOL = [['sigil-silver', '星银刻印', 1], ['cur-dust', '刻尘', 0], ['cur-reroll', '重铸石', 2], ['mat-soul', '灵质', 1], ['use-smoke', '烟雾弹', 1], ['sigil-stone', '石纹刻印', 1]];
function patrolDrop(p) {
  if (p.drop) return p.drop;
  const rng = G.makeRng(MAP.seed + '|drop|' + p.enemy + '|' + p.route.join(','));
  return (p.drop = rng.shuffle(DROP_POOL).slice(0, rng.int(2, 3)).map(([icon, name, r]) => ({ icon, name, r, q: icon === 'cur-dust' ? rng.int(3, 6) : 1 })));
}
const RELIC_POOL = [['霜心', '冻结的敌人受到骷髅伤害 +15%', 'cur-quality'], ['雪原之心', '每场战斗开始时首位队员获得 4 点护甲', 'mat-soul'], ['冰魄护符', '冰霜宝石的伤害 +20%', 'mat-memory'], ['寒光指环', '第一回合额外获得 1 次行动', 'sigil-silver']];
function patrolEnc(p) {
  const pool = G.BIOMES.winter.pool, lead = pool.high.find((u) => u.nm === p.enemy) || pool.high[0];
  const mk = (b, r, af) => ({ ...b, st: b.st.map((v, i) => (i === 2 ? Math.round(v * 1.6) : Math.round(v * 1.2))), rarity: r, rk: ['普通', '精良', '稀有'][r], af });
  // 冰潮每涨两次，游荡敌人的随从多一名精良（后台按冰潮次数加强，界面只说"变强了"）
  const up = Math.min(2, Math.floor(S.tide / 2));
  return { kind: '游荡敌人', team: [mk(lead, 2, ['先发', '冰封']), mk(pool.low[0], 1, ['坚甲']), mk(pool.low[2], up >= 1 ? 1 : 0, up >= 1 ? ['再生'] : []), mk(pool.low[3], up >= 2 ? 1 : 0, up >= 2 ? ['荆棘'] : [])],
    rw: [['node-loot', '2–3 件战利品', '打赢直接放进背包']],
    tip: (up ? '冰潮涨过之后，它们的随从变强了。' : '') + (S.smoke ? '用烟雾弹：你留在原地，它会走开，之后还可能再碰上。' : '') };
}
const KIND_TAG = { 驻守敌人: 'red', 游荡敌人: 'red', 稀有怪巢: 'vio', 领主: 'gold', 首领: 'red', 冰封棺: 'cy' };
let encCtx = null;
function openEncounter(n, o) {
  const e = o.patrol ? patrolEnc(o.patrol) : n.enc;
  encCtx = { n, ...o, e };
  // 标签写类别；标题写这一场的名字：领主 / 首领用本名，巡逻写"某某巡逻队"，其余用地名
  $('#encKind').textContent = e.kind; $('#encKind').className = 'tag ' + (KIND_TAG[e.kind] || 'red');
  $('#encName').textContent = o.patrol ? `${o.patrol.enemy}巡逻队` : n.name || n.place;
  const ph = $('#encPhase'); ph.hidden = !e.phases; ph.textContent = `共 ${e.phases} 个阶段`;
  $('#encWhere').textContent = o.patrol ? `${layerOf(n)} · ${n.place}` : n.name ? `${layerOf(n)} · ${n.place}` : layerOf(n);
  $('#foes').innerHTML = e.team.map((u) => `<div class="foe">${troopCard(u, { r: RAR(u), sub: u.rk })}<div class="afs">${u.af.length ? u.af.map((a) => `<span class="tag" title="${esc(AFFIX[a][0])} · 对策：${esc(AFFIX[a][1])}"><b class="bad">${a}</b>${esc(AFFIX[a][0])}</span>`).join('') : '<span class="tag">无词缀</span>'}</div></div>`).join('');
  // 怎么打：全队词缀去重计数，直接列对策
  const cnt = {}; e.team.forEach((u) => u.af.forEach((a) => (cnt[a] = (cnt[a] || 0) + 1)));
  $('#encHow').innerHTML = Object.keys(cnt).length ? '<span>怎么打</span>' + Object.entries(cnt).map(([a, k]) => `<span><b>${esc(AFFIX[a][1])}</b>（${a}${k > 1 ? ' ×' + k : ''}）</span>`).join('') : '<span>怎么打</span><span>这队没有词缀，正常打就行</span>';
  let tip = e.tip || '';
  if (!o.patrol && MAP.altarRange.has(n.id)) tip += ' 这场在祭坛范围内，敌人会记入血祭名单。';
  $('#encTip').textContent = tip.trim();
  $('#encReward').innerHTML = '<small>胜利可得</small>' + (e.rw || []).map(([icon, nm, note]) => `<span class="rwi">${itemBox({ icon, r: 2 }, 32)}<b>${esc(nm)}</b><small>${esc(note)}</small></span>`).join('');
  // 三种模式的按钮：查看（还没走到）/ 走进战斗区域 / 撞上巡逻。走进去以后不能用 X 或 Esc 绕过
  const L = $('#encLeave'), F = $('#encFight');
  $('#encClose').hidden = !o.peek; $('#encNoSmoke').hidden = true; L.hidden = false; L.disabled = false; F.disabled = false;
  if (o.peek) {
    const r = path(S.cur, n.id); L.hidden = true;
    if (r.length === 1) { F.disabled = true; F.textContent = '过不去'; }
    else F.innerHTML = goLabel(r, '到了就开战');
  } else {
    const fightHint = tideIn(2) ? (tideNext(S.cur) ? '打完这里会被冰封' : '打完冰潮会上涨') : '';
    F.innerHTML = '战斗' + (fightHint ? `<small>${fightHint}</small>` : '');
    if (o.patrol) {
      if (S.smoke) L.innerHTML = `烟雾弹脱离<small>剩 ${S.smoke} 个</small>`;
      else { L.hidden = true; $('#encNoSmoke').hidden = false; }
    } else if (!S.prev || S.sealed.has(S.prev)) { L.disabled = true; L.textContent = '来路已被冰封'; }
    else L.innerHTML = `退回${esc(MAP.byId[S.prev].place)}<small>${tideIn(1) ? '退回去冰潮会涨' : '要走一段'}</small>`;
  }
  $('#encounter').classList.add('on');
}
const closeEnc = () => $('#encounter').classList.remove('on');
$('#encClose').onclick = closeEnc;
$('#encounter').addEventListener('click', (e) => { if (e.target.id === 'encounter' && encCtx && encCtx.peek) closeEnc(); });
$('#encLeave').onclick = () => {
  const c = encCtx; closeEnc();
  if (c.patrol) { if (!S.smoke) return; S.smoke--; c.patrol.pos = (c.patrol.pos + 2) % c.patrol.route.length; spend(1); toast(`用掉 1 个烟雾弹，${c.patrol.enemy}走开了`); }
  else if (S.prev && !S.sealed.has(S.prev)) moveOne(S.prev);
  renderRun();
};
/* 战斗结算：这一场实际入账的东西一次算定（grants），同一份数组既放进背包也交给结算页；
   留在地图上的（驻守区域变成的战利品堆、背包放不下的）单独列出，写明"留在原地"。没有实际入账的一律不显示，不重新抽 */
function battleResult(c) {
  const n = c.n, grants = [], left = [], unlocks = [];
  const add = (x) => (S.bag.length < 16 ? (S.bag.push({ ...x, new: 1 }), grants.push(x)) : left.push(x));
  let pile = null, relic = null;
  if (c.patrol) patrolDrop(c.patrol).forEach(add);
  else if (n.t === 'guard') pile = n.loot = n.loot || [{ icon: 'sigil-silver', r: 1, name: '星银刻印' }, { icon: 'cur-dust', r: 0, name: '刻尘', q: 5 }];
  else if (n.t === 'coffin') { (n.loot || []).forEach(add); S.looted.add(n.id); n.loot = []; }
  else if (n.t === 'nest') {
    // 遗物三选一：三个选项按种子定好；原型默认选第一个，正式版在结算页让玩家选，选中的那件写进 grants
    const opts = n.relicOpts || (n.relicOpts = G.makeRng(MAP.seed + '|relic|' + n.id).shuffle(RELIC_POOL).slice(0, 3));
    const [nm, d, icon] = opts[0]; relic = { nm, d, icon, r: 2 }; S.relics.push(relic);
  } else if (n.t === 'lord') { add({ icon: 'sigil-silver', r: 3, name: '传说刻印 · 霜纹之握' }); unlocks.push(n.enc.rw[1][1]); }
  else if (n.t === 'boss') { add({ icon: 'sigil-iron', r: 4, name: '首领刻印 · 寒冬王冠' }); unlocks.push('首杀铭文'); }
  if (left.length) n.drop = (n.drop || []).concat(left);
  return { grants, left, pile, relic, unlocks };
}
$('#encFight').onclick = () => {
  const c = encCtx; closeEnc();
  if (c.peek) return travel(c.n.id);
  const before = S.list;
  if (c.patrol) c.patrol.dead = true; else S.cleared.add(c.n.id);
  if (!c.patrol && MAP.altarRange.has(c.n.id)) S.list = Math.min(8, S.list + c.e.team.length);
  S.hp = S.hp.map((v, i) => Math.max(5, v - 8 - ((i * 7 + S.step) % 13)));
  const res = battleResult(c);
  spend(2);
  renderRun();
  settleSheet(c, res, S.list - before);
};
// 战斗结算页（原型）：只显示这一场真实拿到的名称和数量
function settleSheet(c, res, listUp) {
  const row = (x, tag) => `<div class="lrow">${itemBox(x)}<span><b>${esc(itemName(x))}${qtyText(x)}</b><small>${RNM[x.r || 0]}</small></span>${tag ? `<span class="end tag ${tag[1]}">${tag[0]}</span>` : ''}</div>`;
  const got = res.grants.map((x) => row(x, ['已放进背包', 'good'])).join('')
    + (res.relic ? `<div class="lrow"><span class="it relic r2" style="--s:52px"><img src="${ico(res.relic.icon)}" alt=""></span><span><b>遗物 · ${res.relic.nm}</b><small>${res.relic.d}</small></span><span class="end tag good">已获得</span></div>` : '')
    + res.unlocks.map((u) => `<div class="lrow">${itemBox({ icon: 'mat-soul', r: 3 })}<span><b>解锁：${esc(u)}</b><small>首次击败</small></span></div>`).join('');
  const body = `<h4>本场获得</h4>${got || '<p class="muted">这一场没有直接放进背包的东西。</p>'}`
    + (res.pile ? `<h4>留在原地</h4>${res.pile.map((x) => row(x)).join('')}<p class="muted" style="font-size:13px">这一堆在${esc(c.n.place)}，点"搜刮"就能拿。</p>` : '')
    + (res.left.length ? `<h4>背包满了，留在原地</h4>${res.left.map((x) => row(x)).join('')}` : '')
    + (listUp ? `<p class="note" style="margin-top:14px">血祭名单 +${listUp}</p>` : '')
    + (res.relic ? '<p class="muted" style="font-size:13px">原型里遗物默认选第一个；正式版在这里让你三选一。</p>' : '');
  sheet('胜利', (c.patrol ? c.patrol.enemy + '巡逻队' : c.n.name || c.n.place) + ' · 战斗结算', body, `<button class="primary" id="setOk" style="flex:1">回到地图</button>`);
  $('#setOk').onclick = () => { closeSheet(); select(S.cur); };
}

/* ---------- 原型工具条 ---------- */
$('#regen').onclick = () => newRun($('#seed').value.trim() || 'abyss', $('#rtype').value);
$('#reseed').onclick = () => newRun('frost-' + Math.floor(1000 + Math.random() * 9000), $('#rtype').value);
$('#rtype').onchange = () => newRun($('#seed').value.trim() || 'abyss', $('#rtype').value);
$$('#segRun [data-rt]').forEach((b) => (b.onclick = () => newRun($('#seed').value.trim() || 'abyss', b.dataset.rt)));

newRun($('#seed').value, 'standard');
applyPass();
function routeFromHash() {
  const h = location.hash.slice(1);
  if (h === 'encounter') { go('run'); const lord = MAP.nodes.find((n) => n.t === 'lord'); openEncounter(lord, { peek: true }); return; }
  if (['camp', 'device', 'prepare', 'run'].includes(h)) go(h);
}
addEventListener('hashchange', routeFromHash); routeFromHash();
</script>
</body>
</html>
