<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>鹈鹕骑自行车</title>
<style>
  html,body{margin:0;height:100%;display:flex;align-items:center;justify-content:center;background:linear-gradient(#aee3ff 0%,#dff4ff 60%,#cfe9c8 60%,#b8dfa8 100%);overflow:hidden;}
  svg{width:min(90vw,900px);height:auto;}

  /* 车轮 */
  .wheel-spin{transform-origin:center;animation:spin 0.9s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* 整车 + 鹈鹕轻微颠簸 */
  .bike{animation:bounce 0.45s ease-in-out infinite alternate;}
  @keyframes bounce{from{transform:translateY(0);}to{transform:translateY(-4px);}}

  /* 腿部蹬踏 */
  .leg-front{animation:pedalF 0.9s linear infinite;}
  .leg-back{animation:pedalB 0.9s linear infinite;}
  @keyframes pedalF{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
  }
  @keyframes pedalB{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
  }
  .pedal-crank{transform-origin:0 0;animation:spin 0.9s linear infinite;}

  /* 身体起伏 */
  .pelican-body{transform-origin:200px 150px;animation:bodyBob 0.9s ease-in-out infinite;}
  @keyframes bodyBob{0%,100%{transform:translateY(0) rotate(0deg);}50%{transform:translateY(-2px) rotate(-1.5deg);}}

  /* 翅膀扇动 */
  .wing{transform-origin:250px 130px;animation:flap 0.6s ease-in-out infinite;}
  @keyframes flap{0%,100%{transform:rotate(0deg);}50%{transform:rotate(-14deg);}}

  /* 背景移动 */
  .clouds{animation:drift 9s linear infinite;}
  @keyframes drift{from{transform:translateX(900px);}to{transform:translateX(-400px);}}
  .ground-lines{animation:roadmove 0.7s linear infinite;}
  @keyframes roadmove{from{transform:translateX(0);}to{transform:translateX(-80px);}}
</style>
</head>
<body>
<svg viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
  <!-- 太阳 -->
  <circle cx="780" cy="80" r="45" fill="#ffd66b"/>

  <!-- 云朵（向左飘） -->
  <g class="clouds" fill="#ffffff" opacity="0.9">
    <ellipse cx="0" cy="90" rx="55" ry="22"/>
    <ellipse cx="40" cy="75" rx="40" ry="20"/>
    <ellipse cx="250" cy="60" rx="45" ry="18"/>
    <ellipse cx="290" cy="72" rx="32" ry="15"/>
    <ellipse cx="520" cy="100" rx="50" ry="20"/>
  </g>

  <!-- 地面 -->
  <rect x="0" y="400" width="900" height="100" fill="#8bc46f"/>
  <rect x="0" y="396" width="900" height="8" fill="#6fa855"/>

  <!-- 路面虚线（向后滚动） -->
  <g class="ground-lines" stroke="#e8f5d8" stroke-width="6" stroke-dasharray="40 40">
    <line x1="0" y1="440" x2="1000" y2="440"/>
  </g>

  <g class="bike">
    <!-- 后轮 -->
    <g transform="translate(300,400)">
      <circle r="52" fill="none" stroke="#333" stroke-width="9"/>
      <circle r="45" fill="none" stroke="#888" stroke-width="3"/>
      <g class="wheel-spin" stroke="#999" stroke-width="3">
        <line x1="-45" y1="0" x2="45" y2="0"/>
        <line x1="0" y1="-45" x2="0" y2="45"/>
        <line x1="-32" y1="-32" x2="32" y2="32"/>
        <line x1="-32" y1="32" x2="32" y2="-32"/>
      </g>
      <circle r="7" fill="#444"/>
    </g>

    <!-- 前轮 -->
    <g transform="translate(520,400)">
      <circle r="52" fill="none" stroke="#333" stroke-width="9"/>
      <circle r="45" fill="none" stroke="#888" stroke-width="3"/>
      <g class="wheel-spin" stroke="#999" stroke-width="3">
        <line x1="-45" y1="0" x2="45" y2="0"/>
        <line x1="0" y1="-45" x2="0" y2="45"/>
        <line x1="-32" y1="-32" x2="32" y2="32"/>
        <line x1="-32" y1="32" x2="32" y2="-32"/>
      </g>
      <circle r="7" fill="#444"/>
    </g>

    <!-- 车架 -->
    <g stroke="#e74c3c" stroke-width="9" stroke-linecap="round" fill="none">
      <path d="M300,400 L390,300 L490,300"/>
      <path d="M300,400 L400,400 L390,300"/>
      <path d="M400,400 L470,315"/>
      <path d="M520,400 L505,300 L470,315"/>
      <path d="M520,400 L505,300"/>
    </g>
    <!-- 车把与车座 -->
    <path d="M505,300 L515,265 L545,258" stroke="#333" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M390,300 L378,268" stroke="#333" stroke-width="9" stroke-linecap="round"/>
    <ellipse cx="374" cy="264" rx="24" ry="9" fill="#333"/>
    <!-- 脚踏曲柄 -->
    <g transform="translate(400,400)">
      <circle r="16" fill="none" stroke="#444" stroke-width="6"/>
      <g class="pedal-crank">
        <line x1="0" y1="0" x2="0" y2="-34" stroke="#333" stroke-width="6" stroke-linecap="round"/>
        <rect x="-9" y="-40" width="18" height="8" rx="3" fill="#222"/>
        <line x1="0" y1="0" x2="0" y2="34" stroke="#333" stroke-width="6" stroke-linecap="round"/>
        <rect x="-9" y="32" width="18" height="8" rx="3" fill="#222"/>
      </g>
    </g>

    <!-- 鹈鹕（后腿在车架后面） -->
    <g class="leg-back">
      <path d="M320,235 L385,375" stroke="#e8973f" stroke-width="14" stroke-linecap="round" fill="none"/>
      <path d="M385,375 L404,396" stroke="#f0a04b" stroke-width="10" stroke-linecap="round"/>
      <path d="M396,392 L428,392" stroke="#f4a83c" stroke-width="8" stroke-linecap="round"/>
    </g>

    <g class="pelican-body">
      <!-- 尾羽 -->
      <path d="M285,220 Q250,205 240,230 Q265,240 290,240 Z" fill="#f5f5f5" stroke="#ccc" stroke-width="2"/>
      <!-- 身体 -->
      <ellipse cx="330" cy="200" rx="80" ry="58" fill="#fdfdfd" stroke="#d8d8d8" stroke-width="3"/>
      <!-- 脖子 -->
      <path d="M390,180 Q420,130 445,105" stroke="#fdfdfd" stroke-width="34" fill="none" stroke-linecap="round"/>
      <!-- 头 -->
      <circle cx="455" cy="98" r="32" fill="#fdfdfd" stroke="#d8d8d8" stroke-width="3"/>
      <!-- 大嘴 -->
      <path d="M470,95 L585,112 L585,122 Q540,132 472,118 Z" fill="#f7b23b" stroke="#e09322" stroke-width="3"/>
      <path d="M470,118 Q540,140 585,128" stroke="#e09322" stroke-width="3" fill="#f9a825"/>
      <!-- 眼睛 -->
      <circle cx="458" cy="88" r="6" fill="#222"/>
      <circle cx="460" cy="86" r="2" fill="#fff"/>
      <!-- 翅膀 -->
      <g class="wing">
        <path d="M300,170 Q250,160 235,195 Q270,215 315,205 Q330,190 300,170 Z"
              fill="#eceff4" stroke="#c8ccd4" stroke-width="3"/>
        <path d="M265,180 Q250,190 255,200" stroke="#c8ccd4" stroke-width="2" fill="none"/>
        <path d="M280,178 Q265,192 272,204" stroke="#c8ccd4" stroke-width="2" fill="none"/>
      </g>
    </g>

    <!-- 前腿（在身体前面） -->
    <g class="leg-front">
      <path d="M335,240 L390,382" stroke="#f4a83c" stroke-width="15" stroke-linecap="round" fill="none"/>
      <path d="M390,382 L407,398" stroke="#f7b23b" stroke-width="10" stroke-linecap="round"/>
      <path d="M400,396 L432,394" stroke="#f7b23b" stroke-width="8" stroke-linecap="round"/>
    </g>

    <!-- 手臂扶车把 -->
    <path d="M365,175 Q445,215 512,262" stroke="#fdfdfd" stroke-width="20" fill="none" stroke-linecap="round"/>
    <path d="M365,175 Q445,215 512,262" stroke="#d8d8d8" stroke-width="2" fill="none" stroke-dasharray="1 0" opacity="0"/>
    <circle cx="516" cy="262" r="10" fill="#f4a83c"/>
  </g>
</svg>
</body>
</html>
