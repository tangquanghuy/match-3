<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  :root{ color-scheme: light; }
  *{ box-sizing: border-box; }
  body{
    margin:0; min-height:100vh; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:12px;
    background:linear-gradient(180deg,#bfe7fb 0%,#e9f8ff 55%,#f7fcff 100%);
    font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif; color:#2c3a47;
  }
  h1{ margin:4px 0 0; font-size:26px; letter-spacing:3px; }
  svg{
    width:min(920px,94vw); height:auto; border-radius:18px;
    box-shadow:0 18px 45px rgba(30,60,90,.18); cursor:pointer; user-select:none;
  }
  .hint{ margin:0 0 16px; font-size:14px; color:#51606f; }
  @keyframes rayspin{ to{ transform:rotate(360deg); } }
  #rays{ transform-box:view-box; transform-origin:820px 110px; animation:rayspin 40s linear infinite; }
</style>
</head>
<body>
<h1>🚲 鹈鹕骑自行车</h1>

<svg id="scene" viewBox="0 0 960 600" role="img" aria-label="一只鹈鹕骑着自行车前进的 2D 动画">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#eaf9ff"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#59636f"/><stop offset="1" stop-color="#3a424c"/>
    </linearGradient>
    <radialGradient id="sunGrad">
      <stop offset="0" stop-color="#fff6c8"/><stop offset="1" stop-color="#ffd54a"/>
    </radialGradient>
    <radialGradient id="bodyGrad" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f2ead4"/>
    </radialGradient>
  </defs>

  <!-- 天空 / 太阳 / 飞鸟 -->
  <rect width="960" height="600" fill="url(#skyGrad)"/>
  <circle cx="820" cy="110" r="44" fill="url(#sunGrad)" stroke="#f2b90d" stroke-width="3"/>
  <g id="rays" stroke="#ffd23e" stroke-width="5" stroke-linecap="round" opacity="0.9"></g>
  <path d="M132 128 q 9 -9 18 0 q 9 -9 18 0" fill="none" stroke="#7c93a6" stroke-width="3" stroke-linecap="round"/>
  <path d="M196 98 q 7 -7 14 0 q 7 -7 14 0" fill="none" stroke="#7c93a6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- 云（JS 生成并驱动漂移） -->
  <g id="clouds" fill="#ffffff" opacity="0.93"></g>
  <!-- 远山与树（JS 生成，慢速视差滚动） -->
  <g id="hills"></g>

  <!-- 马路 -->
  <rect y="480" width="960" height="7" fill="#d9dfe4"/>
  <rect y="487" width="960" height="113" fill="url(#roadGrad)"/>
  <g id="dashes"></g>
  <ellipse cx="432" cy="489" rx="215" ry="9" fill="rgba(18,26,34,0.22)"/>

  <!-- 远侧曲柄 / 脚踏 / 腿（画在车架后面） -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line id="crankFar" x1="410" y1="418" x2="372" y2="418" stroke="#565c63" stroke-width="7"/>
    <g id="pedalFar">
      <rect x="-13" y="-4" width="26" height="8" rx="3" fill="#1d2126"/>
      <path d="M -4 -12 Q 12 -16 25 -5 Q 28 -1 24 1 L -6 1 Q -7 -7 -4 -12 Z"
            fill="#cf8a2a" stroke="#6e4a16" stroke-width="2"/>
    </g>
    <path id="legFarA" d="" stroke="#6e4a16" stroke-width="15"/>
    <path id="legFarB" d="" stroke="#cf8a2a" stroke-width="9"/>
  </g>

  <!-- 车轮 -->
  <g transform="translate(300 408)">
    <circle r="72" fill="none" stroke="#2e3238" stroke-width="11"/>
    <circle r="59" fill="none" stroke="#98a1ab" stroke-width="4"/>
    <g id="spokesR" stroke="#b9c1c9" stroke-width="3">
      <line x1="-59" y1="0" x2="59" y2="0"/><line x1="0" y1="-59" x2="0" y2="59"/>
      <line x1="-42" y1="-42" x2="42" y2="42"/><line x1="-42" y1="42" x2="42" y2="-42"/>
      <circle cx="0" cy="-30" r="4" fill="#e05555" stroke="none"/>
    </g>
    <circle r="9" fill="#3a414b"/>
  </g>
  <g transform="translate(560 408)">
    <circle r="72" fill="none" stroke="#2e3238" stroke-width="11"/>
    <circle r="59" fill="none" stroke="#98a1ab" stroke-width="4"/>
    <g id="spokesF" stroke="#b9c1c9" stroke-width="3">
      <line x1="-59" y1="0" x2="59" y2="0"/><line x1="0" y1="-59" x2="0" y2="59"/>
      <line x1="-42" y1="-42" x2="42" y2="42"/><line x1="-42" y1="42" x2="42" y2="-42"/>
      <circle cx="0" cy="-30" r="4" fill="#e05555" stroke="none"/>
    </g>
    <circle r="9" fill="#3a414b"/>
  </g>

  <!-- 车架 / 车座 / 车把 -->
  <path d="M300 408 L410 418 L369 302 M300 408 L371 306 M370 310 L531 307 M531 307 L410 418 M532 304 L546 344 L560 408"
        fill="none" stroke="#e63946" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="369" y1="302" x2="372" y2="290" stroke="#33383e" stroke-width="5" stroke-linecap="round"/>
  <path d="M346 292 Q 372 280 398 289 Q 374 299 346 292 Z" fill="#3a3f45" stroke="#22262b" stroke-width="2"/>
  <path d="M532 304 L524 284" stroke="#33383e" stroke-width="6" stroke-linecap="round" fill="none"/>
  <path d="M524 284 C 506 278 496 288 500 302" stroke="#33383e" stroke-width="6" stroke-linecap="round" fill="none"/>
  <circle cx="500" cy="303" r="4.5" fill="#22262b"/>

  <!-- 链条与牙盘 -->
  <circle cx="300" cy="408" r="13" fill="none" stroke="#454b52" stroke-width="5"/>
  <circle cx="410" cy="418" r="22" fill="none" stroke="#454b52" stroke-width="5"/>
  <line id="chainTop" x1="300" y1="395" x2="410" y2="396" stroke="#454b52" stroke-width="4" stroke-dasharray="7 5"/>
  <line id="chainBot" x1="300" y1="421" x2="410" y2="440" stroke="#454b52" stroke-width="4" stroke-dasharray="7 5"/>

  <!-- 近侧曲柄 / 脚踏 / 腿（画在车架前面） -->
  <g stroke-linecap="round" stroke-linejoin="round" fill="none">
    <line id="crankNear" x1="410" y1="418" x2="448" y2="418" stroke="#2c3136" stroke-width="7"/>
    <g id="pedalNear">
      <rect x="-13" y="-4" width="26" height="8" rx="3" fill="#2c3136"/>
      <path d="M -4 -12 Q 12 -16 25 -5 Q 28 -1 24 1 L -6 1 Q -7 -7 -4 -12 Z"
            fill="#f5a733" stroke="#7c5218" stroke-width="2"/>
    </g>
    <path id="legNearA" d="" stroke="#7c5218" stroke-width="15"/>
    <path id="legNearB" d="" stroke="#f5a733" stroke-width="9"/>
  </g>

  <!-- 鹈鹕 -->
  <g id="pelican">
    <path id="tail" d="M320 240 L284 212 L310 220 L300 190 L326 216 Z"
          fill="#fffdf2" stroke="#4a3b2b" stroke-width="3" stroke-linejoin="round"/>
    <ellipse cx="368" cy="248" rx="62" ry="44" transform="rotate(-12 368 248)"
             fill="url(#bodyGrad)" stroke="#4a3b2b" stroke-width="3"/>
    <g id="wing">
      <ellipse cx="352" cy="258" rx="33" ry="21" transform="rotate(-16 352 258)"
               fill="#f4ecd6" stroke="#4a3b2b" stroke-width="2.5"/>
      <path d="M330 262 Q 352 271 376 261 M328 250 Q 352 259 378 249"
            fill="none" stroke="#d9cdaa" stroke-width="2"/>
    </g>
    <g id="neckG">
      <path d="M402 240 C 434 236 416 196 450 172" fill="none" stroke="#4a3b2b" stroke-width="26" stroke-linecap="round"/>
      <path d="M402 240 C 434 236 416 196 450 172" fill="none" stroke="#fffdf2" stroke-width="20" stroke-linecap="round"/>
      <circle cx="455" cy="163" r="25" fill="url(#bodyGrad)" stroke="#4a3b2b" stroke-width="3"/>
      <g id="cap">
        <ellipse cx="447" cy="138" rx="23" ry="8.5" transform="rotate(-10 447 138)"
                 fill="#e2483f" stroke="#a32c26" stroke-width="2"/>
        <circle cx="447" cy="128" r="3.5" fill="#a32c26"/>
      </g>
      <g id="eye" transform="translate(466 154)">
        <circle r="8.5" fill="#ffffff" stroke="#4a3b2b" stroke-width="2"/>
        <circle cx="2.5" cy="0.5" r="4" fill="#2a2118"/>
        <circle cx="4.2" cy="-1.5" r="1.4" fill="#ffffff"/>
      </g>
      <g id="pouchG">
        <path d="M472 180 C 490 235 555 232 598 198 C 566 191 516 183 472 180 Z"
              fill="#f08b1e" stroke="#a86412" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
      <g id="beakTopG">
        <path d="M470 152 C 520 158 570 176 600 196 C 566 191 516 183 472 180 Z"
              fill="#f7a93b" stroke="#a86412" stroke-width="2.5" stroke-linejoin="round"/>
      </g>
    </g>
  </g>

  <!-- 风的速度线 -->
  <g id="wind" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="196" y1="214" x2="252" y2="214"/>
    <line x1="176" y1="252" x2="244" y2="252"/>
    <line x1="200" y1="290" x2="248" y2="290"/>
  </g>

  <!-- 嘎！气泡 -->
  <g id="bubble" opacity="0" transform="translate(560 118)">
    <rect x="-14" y="-64" width="132" height="50" rx="14" fill="#ffffff" stroke="#4a3b2b" stroke-width="3"/>
    <polygon points="2,-2 16,-22 34,-8" fill="#ffffff" stroke="#4a3b2b" stroke-width="3" stroke-linejoin="round"/>
    <text x="52" y="-30" text-anchor="middle" font-size="26" font-weight="700" fill="#e2483f"
          font-family="'Segoe UI','Microsoft YaHei',sans-serif">嘎——!</text>
  </g>
</svg>

<p class="hint">点击画面（或按空格）→ 鹈鹕会张开大嘴“嘎——！”一声 🎺</p>

<script>
(function(){
  'use strict';
  const NS = 'http://www.w3.org/2000/svg';
  const $ = id => document.getElementById(id);
  const mod = (a, n) => ((a % n) + n) % n;

  /* ---------- 静态装饰：阳光、远山、路面虚线、云 ---------- */
  let s = '';
  for (let i = 0; i < 12; i++) {
    const a = i * Math.PI / 6, c = Math.cos(a), sn = Math.sin(a);
    s += `<line x1="${(820+56*c).toFixed(1)}" y1="${(110+56*sn).toFixed(1)}"
                x2="${(820+74*c).toFixed(1)}" y2="${(110+74*sn).toFixed(1)}"/>`;
  }
  $('rays').innerHTML = s;

  s = '';
  for (let k = -1; k <= 3; k++) {
    const o = k * 480;
    s += `<ellipse cx="${o+110}" cy="492" rx="220" ry="66" fill="#bfe0aa"/>`
       + `<ellipse cx="${o+350}" cy="498" rx="180" ry="52" fill="#a9d494"/>`
       + `<rect x="${o+68}" y="394" width="9" height="34" rx="3" fill="#8a5a33"/>`
       + `<circle cx="${o+72}" cy="382" r="22" fill="#57a05e"/>`
       + `<circle cx="${o+56}" cy="393" r="14" fill="#4a9152"/>`
       + `<ellipse cx="${o+300}" cy="449" rx="30" ry="12" fill="#8cc47e"/>`;
  }
  $('hills').innerHTML = s;

  s = '';
  for (let x = -120; x <= 1080; x += 100) {
    s += `<rect x="${x}" y="538" width="56" height="9" rx="4.5" fill="#eef2f4" opacity="0.85"/>`;
  }
  $('dashes').innerHTML = s;

  const clouds = [];
  [{x:150,y:112,s:1.15},{x:520,y:70,s:0.8},{x:790,y:168,s:0.65}].forEach(c => {
    const g = document.createElementNS(NS, 'g');
    g.innerHTML = `<g transform="scale(${c.s})">`
      + `<ellipse rx="48" ry="20"/><ellipse cx="-34" cy="8" rx="30" ry="14"/>`
      + `<ellipse cx="34" cy="7" rx="34" ry="15"/><ellipse cx="4" cy="-13" rx="30" ry="16"/></g>`;
    $('clouds').appendChild(g);
    clouds.push({ el: g, baseX: c.x, y: c.y, drift: 8 + Math.random() * 8 });
  });

  /* ---------- 骨骼参数 ---------- */
  const CRANK = { x: 410, y: 418 };          // 中轴（踏板圆心）
  const R_CRANK = 38;                         // 曲柄长
  const L1 = 88, L2 = 88;                     // 大腿 / 小腿
  const HIP_N = { x: 384, y: 284 };           // 近侧腿髋关节
  const HIP_F = { x: 372, y: 280 };           // 远侧腿髋关节
  const WHEEL_R = 72;
  const CRANK_SPEED = 1.8;                    // rad/s
  const GEAR = 22 / 13;                       // 轮转速 = 脚踏转速 × 传动比
  const CHAIN_DASH = 12;                      // 链条虚线周期

  let theta = 0, dist = 0, honkAt = -9;
  let last = performance.now();

  /* 两段式反向运动学：膝盖向前弯 */
  function setLeg(aEl, bEl, crankEl, pedalEl, hip, phase, bob) {
    const phi = theta + phase;
    const F = { x: CRANK.x + R_CRANK * Math.cos(phi), y: CRANK.y + R_CRANK * Math.sin(phi) };
    const H = { x: hip.x, y: hip.y + bob };
    const A = { x: F.x - 1, y: F.y - 10 };    // 脚踝踩在脚踏上方
    let dx = A.x - H.x, dy = A.y - H.y;
    const len = Math.hypot(dx, dy);
    const dd = Math.max(Math.abs(L1 - L2) + 2, Math.min(L1 + L2 - 2, len));
    const a = (L1*L1 - L2*L2 + dd*dd) / (2 * dd);
    const h = Math.sqrt(Math.max(0, L1*L1 - a*a));
    const ux = dx / len, uy = dy / len;
    const k1 = { x: H.x + ux*a - uy*h, y: H.y + uy*a + ux*h };
    const k2 = { x: H.x + ux*a + uy*h, y: H.y + uy*a - ux*h };
    const K = k1.x > k2.x ? k1 : k2;
    const d = `M${H.x.toFixed(1)} ${H.y.toFixed(1)} L${K.x.toFixed(1)} ${K.y.toFixed(1)} L${A.x.toFixed(1)} ${A.y.toFixed(1)}`;
    aEl.setAttribute('d', d);
    bEl.setAttribute('d', d);
    crankEl.setAttribute('x2', F.x.toFixed(1));
    crankEl.setAttribute('y2', F.y.toFixed(1));
    pedalEl.setAttribute('transform', `translate(${F.x.toFixed(1)} ${F.y.toFixed(1)})`);
  }

  function frame(now) {
    const t = now / 1000;
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;

    theta += CRANK_SPEED * dt;
    dist  += CRANK_SPEED * GEAR * WHEEL_R * dt;
    const wheelDeg = dist / WHEEL_R * 180 / Math.PI;

    $('spokesR').setAttribute('transform', `rotate(${(wheelDeg % 360).toFixed(1)})`);
    $('spokesF').setAttribute('transform', `rotate(${((wheelDeg + 14) % 360).toFixed(1)})`);
    $('dashes').setAttribute('transform', `translate(${(-mod(dist, 100)).toFixed(1)} 0)`);
    $('hills').setAttribute('transform', `translate(${(-mod(dist * 0.15, 480)).toFixed(1)} 0)`);
    clouds.forEach(c => {
      const x = mod(c.baseX - dist * 0.05 - t * c.drift + 140, 1240) - 140;
      c.el.setAttribute('transform', `translate(${x.toFixed(1)} ${c.y})`);
    });
    const chainOff = mod(dist * 13 / WHEEL_R, CHAIN_DASH).toFixed(2);
    $('chainTop').setAttribute('stroke-dashoffset', chainOff);
    $('chainBot').setAttribute('stroke-dashoffset', chainOff);

    /* 身体随踩踏节奏起伏、点头、扇翅、摆尾 */
    const bob = 2.6 * Math.sin(2 * theta);
    const pel = $('pelican');
    pel.setAttribute('transform',
      `translate(0 ${bob.toFixed(2)}) rotate(${(1.1 * Math.sin(2 * theta + 0.6)).toFixed(2)} 368 292)`);
    $('wing').setAttribute('transform', `rotate(${(5 * Math.sin(2 * theta + 1.3)).toFixed(2)} 352 258)`);
    $('tail').setAttribute('transform', `rotate(${(3 * Math.sin(2 * theta + 2.2)).toFixed(2)} 322 238)`);
    $('neckG').setAttribute('transform', `rotate(${(1.6 * Math.sin(2 * theta + 1.8)).toFixed(2)} 404 242)`);

    /* 每隔几秒眨一下眼 */
    const bp = t % 3.9;
    const blink = bp < 0.14 ? 1 - Math.sin(Math.PI * bp / 0.14) : 1;
    $('eye').setAttribute('transform', `translate(466 154) scale(1 ${blink.toFixed(2)})`);

    /* 嘎！：张嘴 + 喉囊鼓起 + 气泡弹出 */
    const hp = t - honkAt;
    let open = 0;
    if (hp >= 0 && hp < 0.12) open = hp / 0.12;
    else if (hp >= 0.12 && hp < 0.5) open = 1;
    else if (hp >= 0.5 && hp < 0.78) open = 1 - (hp - 0.5) / 0.28;
    open = open * open * (3 - 2 * open);
    $('beakTopG').setAttribute('transform', `rotate(${(-13 * open).toFixed(1)} 472 166)`);
    const wob = 1 + 0.045 * Math.sin(2 * theta + 0.8) + 0.12 * open;
    $('pouchG').setAttribute('transform',
      `translate(472 178) rotate(${(9 * open).toFixed(1)}) scale(1 ${wob.toFixed(3)}) translate(-472 -178)`);
    const bubble = $('bubble');
    bubble.setAttribute('opacity', open > 0.02 ? (0.4 + 0.6 * open).toFixed(2) : 0);
    bubble.setAttribute('transform', `translate(560 ${(118 + (1 - open) * 10).toFixed(1)}) scale(${(0.6 + 0.4 * open).toFixed(2)})`);

    /* 风的速度线闪烁 */
    $('wind').querySelectorAll('line').forEach((ln, i) => {
      ln.setAttribute('opacity', (0.12 + 0.5 * Math.max(0, Math.sin(t * 7 - i * 1.4))).toFixed(2));
    });

    /* 双腿踩踏（远侧腿相位差 180°） */
    setLeg($('legNearA'), $('legNearB'), $('crankNear'), $('pedalNear'), HIP_N, 0, bob);
    setLeg($('legFarA'),  $('legFarB'),  $('crankFar'),  $('pedalFar'),  HIP_F, Math.PI, bob);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ---------- 互动：嘎！ ---------- */
  function honk() { honkAt = performance.now() / 1000; }
  $('scene').addEventListener('pointerdown', honk);
  window.addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); honk(); }
  });
})();
</script>
</body>
</html>
