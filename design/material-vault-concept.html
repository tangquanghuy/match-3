<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>材料库 · 独立视觉小样</title>
  <style>
    :root {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color-scheme: light;
      --page: #e8e4da;
      --surface: #f8f5ed;
      --shelf: #f1ece1;
      --card: #fffdf7;
      --ink: #303c3e;
      --muted: #6e7774;
      --stroke: #d8cdb9;
      --gold: #b78443;
      --accent: #67552f;
      --accent-ink: #fff8e9;
      --shadow: 0 18px 60px #34312b16;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; background: var(--page); color: var(--ink); transition: background .2s, color .2s; }
    button { font: inherit; cursor: pointer; }
    button:focus-visible { outline: 3px solid #6695aa; outline-offset: 3px; }
    p, h1, h2, h3 { margin: 0; }
    .topbar { display: flex; align-items: center; gap: 30px; height: 74px; padding: 0 clamp(18px, 4vw, 70px); background: #27343a; color: #f5ebd8; }
    .brand { display: flex; align-items: center; gap: 13px; white-space: nowrap; }
    .brand-mark { display: grid; place-items: center; width: 37px; height: 37px; border: 1px solid #cda96e; border-radius: 11px; color: #eac788; font: 26px Georgia, serif; transform: rotate(-8deg); }
    .brand strong { font: 21px Georgia, "Songti SC", serif; letter-spacing: .15em; }
    .mode-switch { border: 1px solid #8c9290; border-radius: 30px; padding: 8px 13px; background: #354448; color: #fff3df; white-space: nowrap; font-size: 12px; }
    .workspace { max-width: 1580px; min-height: calc(100vh - 74px); margin: 0 auto; padding: 30px clamp(18px, 4vw, 66px) 38px; }
    .inventory { overflow: hidden; border: 1px solid #cdbd9f; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
    .tabs { display: flex; gap: 6px; overflow-x: auto; padding: 13px 23px 0; border-bottom: 1px solid var(--stroke); scrollbar-width: thin; }
    .tab { flex: none; min-height: 43px; padding: 0 18px 10px; border: 0; border-bottom: 3px solid transparent; background: none; color: var(--muted); font-size: 13px; white-space: nowrap; }
    .tab strong { margin-left: 7px; padding: 2px 6px; border-radius: 6px; background: var(--shelf); color: var(--muted); font: 11px Georgia, serif; }
    .tab.active { border-color: var(--gold); color: var(--ink); font-weight: 700; }
    .tab.active strong { background: #e9d9b7; color: #765528; }
    .inventory-body { display: grid; grid-template-columns: minmax(0, 1fr) 330px; min-height: 505px; }
    .collection { min-width: 0; padding: 26px 29px 29px; }
    .collection-bar { display: flex; justify-content: space-between; align-items: center; gap: 14px; margin-bottom: 21px; }
    .collection-bar h2 { font: 22px Georgia, "Songti SC", serif; letter-spacing: .08em; }
    .toggle { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--muted); font-size: 12px; cursor: pointer; }
    .toggle input { width: 16px; height: 16px; accent-color: #a47b45; }
    .shelf { position: relative; min-height: 305px; padding: 18px; border: 1px solid var(--stroke); border-radius: 12px; background: var(--shelf); }
    .shelf:before { position: absolute; inset: 7px; border: 1px dashed #cbbca382; border-radius: 8px; content: ""; pointer-events: none; }
    .grid { position: relative; display: grid; grid-template-columns: repeat(auto-fill, minmax(125px, 1fr)); gap: 12px; }
    .item { position: relative; display: flex; flex-direction: column; align-items: center; min-width: 0; min-height: 142px; padding: 16px 8px 13px; border: 1px solid #dad1c2; border-radius: 9px; background: var(--card); color: var(--ink); box-shadow: 0 3px 9px #5248370c; transition: transform .15s, border .15s, box-shadow .15s; }
    .item:hover { transform: translateY(-3px); border-color: var(--rarity); box-shadow: 0 9px 20px #52483725; }
    .item.selected { border-color: var(--rarity); box-shadow: 0 0 0 2px color-mix(in srgb, var(--rarity) 45%, transparent), 0 7px 18px #5248371d; }
    .item.empty { background: color-mix(in srgb, var(--shelf) 65%, var(--card)); border-style: dashed; }
    .item.empty .item-art { filter: grayscale(1); opacity: .38; }
    .rarity-line { position: absolute; top: 0; right: 13px; left: 13px; height: 3px; border-radius: 0 0 5px 5px; background: var(--rarity); }
    .item-art { display: grid; place-items: center; width: 69px; height: 67px; }
    .item-art img, .detail-art img { width: 100%; height: 100%; object-fit: contain; }
    .item-art svg, .detail-art svg { width: 75%; height: 75%; }
    .item-name { overflow: hidden; max-width: 100%; margin-top: 5px; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
    .item-amount { margin-top: 6px; color: var(--accent); font: 17px Georgia, serif; }
    .item.empty .item-amount { color: var(--muted); font: 11px "Microsoft YaHei", sans-serif; }
    .empty-message { position: relative; display: grid; place-items: center; min-height: 208px; color: var(--muted); font-size: 13px; text-align: center; }
    .empty-message[hidden] { display: none; }
    .detail { position: relative; display: flex; flex-direction: column; padding: 26px 27px; border-left: 1px solid var(--stroke); background: var(--shelf); }
    .detail-close, .detail-backdrop { display: none; }
    .detail-overline { color: var(--gold); font-size: 10px; font-weight: 700; letter-spacing: .17em; }
    .detail-art { display: grid; place-items: center; width: 124px; height: 124px; margin: 14px auto 12px; padding: 12px; border: 1px solid var(--stroke); border-radius: 13px; background: var(--card); }
    .detail h3 { text-align: center; font: 23px Georgia, "Songti SC", serif; }
    .detail-amount { margin: 8px 0 19px; color: var(--muted); text-align: center; font-size: 12px; }
    .detail-amount strong { margin-left: 5px; color: var(--accent); font: 22px Georgia, serif; }
    .detail-block { padding: 13px 0; border-top: 1px solid var(--stroke); }
    .detail-block small { display: block; color: var(--gold); font-size: 11px; font-weight: 700; }
    .detail-block p { margin-top: 6px; color: var(--ink); font-size: 12px; line-height: 1.6; }
    .primary { display: block; width: 100%; min-height: 43px; margin-top: auto; border: 0; border-radius: 7px; background: var(--accent); color: var(--accent-ink); font-size: 12px; font-weight: 700; }
    .primary:hover { filter: brightness(1.15); }
    .toast { position: fixed; right: 25px; bottom: 25px; z-index: 12; padding: 12px 18px; border-radius: 9px; background: #27343a; color: #fff0d3; box-shadow: 0 10px 30px #10141655; }
    .toast[hidden] { display: none; }
    body[data-theme="dusk"] { color-scheme: dark; --page: #273032; --surface: #354044; --shelf: #30393c; --card: #424b4d; --ink: #f4ede0; --muted: #d2d1c6; --stroke: #63706e; --gold: #ebc789; --accent: #e6ca91; --accent-ink: #283237; --shadow: 0 18px 60px #11171a55; }
    body[data-theme="dusk"] .inventory { border-color: #6d7d78; }
    body[data-theme="dusk"] .tab.active strong { background: #5b635b; color: #ffdeb0; }
    body[data-theme="dusk"] .shelf:before { border-color: #98a09b55; }
    body[data-theme="dusk"] .item { border-color: #6f7a77; }
    body[data-theme="dusk"] .item.selected { border-color: var(--rarity); }
    @media (max-width: 730px) {
      .inventory-body { display: block; min-height: 0; }
      .detail-backdrop:not([hidden]) { display: block; position: fixed; z-index: 9; inset: 0; background: #1a262b80; }
      .detail { display: none; position: fixed; z-index: 10; right: 0; bottom: 0; left: 0; max-height: 78vh; overflow: auto; border: 1px solid var(--stroke); border-radius: 17px 17px 0 0; box-shadow: 0 -20px 60px #15202070; }
      .detail.open { display: flex; }
      .detail-close { position: absolute; top: 12px; right: 15px; display: grid; place-items: center; width: 32px; height: 32px; border: 1px solid var(--stroke); border-radius: 50%; background: var(--card); color: var(--ink); font-size: 19px; }
    }
    .topbar { height: 58px; gap: 17px; padding: 0 clamp(12px, 3vw, 40px); }
    .brand { gap: 9px; }
    .brand-mark { width: 29px; height: 29px; border-radius: 7px; font-size: 20px; }
    .brand strong { font-size: 16px; letter-spacing: .1em; }
    .page-title { display: flex; align-items: center; gap: 10px; padding-left: 17px; border-left: 1px solid #697477; font: 18px Georgia, "Songti SC", serif; white-space: nowrap; }
    .page-title span { padding: 3px 6px; border: 1px solid #9c9b87; border-radius: 4px; color: #e8c999; font: 10px "Microsoft YaHei", sans-serif; }
    .mode-switch { margin-left: auto; padding: 6px 12px; }
    .workspace { max-width: 1500px; min-height: 0; padding: 14px clamp(12px, 2.4vw, 36px) 20px; }
    .inventory { border-radius: 12px; }
    .tabs { gap: 3px; padding: 5px 16px 0; }
    .tab { display: inline-flex; align-items: center; gap: 7px; min-height: 43px; padding: 0 15px 5px; }
    .tab strong { margin-left: 0; }
    .tab-icon { display: grid; place-items: center; width: 17px; height: 17px; color: var(--gold); }
    .tab-icon svg { width: 100%; height: 100%; fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; stroke-width: 1.6; }
    .inventory-body { grid-template-columns: minmax(0, 1fr) 275px; min-height: 345px; }
    .collection { display: flex; flex-direction: column; padding: 16px 19px 19px; }
    .collection-bar { flex: none; min-height: 28px; margin-bottom: 11px; }
    .collection-bar h2 { font-size: 18px; }
    .shelf { flex: 1; min-height: 0; padding: 12px; background: radial-gradient(circle at 85% 0%, color-mix(in srgb, var(--gold) 10%, var(--shelf)), var(--shelf) 62%); }
    .grid { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 9px; }
    .grid[data-category="ingots"] { grid-template-columns: repeat(4, minmax(0, 1fr)); max-width: 670px; }
    .grid[data-category="supplies"] { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: 530px; }
    .item { min-height: 106px; padding: 9px 5px 7px; border-radius: 7px; }
    .rarity-line { top: 12px; right: auto; bottom: 12px; left: 0; width: 3px; height: auto; border-radius: 0 3px 3px 0; }
    .item-art { width: 57px; height: 53px; }
    .item-name { margin-top: 1px; font-size: 11px; }
    .item-amount { position: absolute; top: 6px; right: 6px; margin: 0; padding: 2px 5px; border-radius: 5px; background: color-mix(in srgb, var(--rarity) 17%, var(--card)); color: var(--ink); font: 700 11px Georgia, serif; }
    .item.empty .item-amount { background: none; font-size: 10px; }
    .detail { padding: 17px 19px; }
    .detail-overline { font-size: 11px; }
    .detail-art { width: 105px; height: 105px; margin: 7px auto 9px; padding: 10px; }
    .detail h3 { font-size: 20px; }
    .detail-amount { margin: 5px 0 12px; }
    .detail-amount strong { font-size: 19px; }
    .detail-block { padding: 9px 0; }
    .detail-block p { margin-top: 5px; }
    .primary { min-height: 38px; margin-top: 14px; }
    @media (max-width: 1000px) and (min-width: 731px) {
      .inventory-body { grid-template-columns: minmax(0, 1fr) 235px; }
      .grid, .grid[data-category="ingots"], .grid[data-category="supplies"] { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 730px) {
      .topbar { height: 54px; gap: 10px; padding: 0 12px; }
      .brand strong { font-size: 14px; }
      .page-title { gap: 0; padding-left: 10px; font-size: 16px; }
      .page-title span { display: none; }
      .mode-switch { padding: 5px 7px; font-size: 10px; }
      .workspace { min-height: 0; padding: 8px 7px 14px; }
      .tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; padding: 3px 3px 0; }
      .tab { justify-content: center; gap: 3px; min-width: 0; min-height: 41px; padding: 0 2px 3px; font-size: 11px; }
      .tab-icon { width: 13px; height: 13px; }
      .tab strong { padding: 2px 4px; font-size: 10px; }
      .collection { padding: 11px 10px 12px; }
      .collection-bar { min-height: 23px; margin-bottom: 7px; }
      .collection-bar h2 { font-size: 16px; }
      .shelf { min-height: 0; padding: 9px; }
      .grid, .grid[data-category="ingots"] { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: none; gap: 6px; }
      .grid[data-category="stones"] { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 5px; }
      .grid[data-category="supplies"] { grid-template-columns: repeat(3, minmax(0, 1fr)); max-width: none; }
      .item { min-height: 94px; padding: 8px 2px 6px; }
      .item-art { width: 45px; height: 43px; }
      .item-name { font-size: 9px; }
      .item-amount { top: 3px; right: 3px; padding: 1px 3px; font-size: 10px; }
      .item.empty .item-amount { font-size: 8px; }
      .rarity-line { top: 8px; bottom: 8px; }
      .detail { padding: 16px 20px 20px; }
      .detail-art { width: 88px; height: 88px; margin: 5px auto; }
      .detail-amount { margin: 5px 0 8px; }
      .detail-block { padding: 7px 0; }
      .primary { margin-top: 10px; }
    }
  </style>
</head>
<body data-theme="day">
  <header class="topbar">
    <div class="brand"><span class="brand-mark" aria-hidden="true">✦</span><strong>创世回廊</strong></div>
    <h1 class="page-title">材料库 <span>视觉小样</span></h1>
    <button class="mode-switch" id="mode-switch" type="button">☾ 暮光模式</button>
  </header>
  <main class="workspace">
    <section class="inventory" aria-label="材料库小样">
      <nav class="tabs" aria-label="材料分类" id="tabs"></nav>
      <div class="inventory-body">
        <section class="collection"><div class="collection-bar"><h2 id="category-title">钢锭</h2><label class="toggle"><input id="owned-only" type="checkbox"> 只看持有</label></div><div class="shelf"><div class="grid" id="grid"></div><div class="empty-message" id="empty-message" hidden>暂无材料，关闭筛选可查看空槽。</div></div></section>
        <aside class="detail" id="detail" aria-label="材料详情"><button class="detail-close" id="detail-close" type="button" aria-label="关闭详情">×</button><div class="detail-overline" id="detail-overline">钢锭</div><div class="detail-art" id="detail-art"></div><h3 id="detail-name"></h3><p class="detail-amount">持有 <strong id="detail-count"></strong></p><div class="detail-block"><small>用途</small><p id="detail-purpose"></p></div><div class="detail-block"><small>来源</small><p id="detail-source"></p></div><button class="primary" id="detail-action" type="button">查看使用场景 →</button></aside>
      </div>
    </section>
  </main>
  <div class="detail-backdrop" id="detail-backdrop" hidden></div>
  <div class="toast" id="toast" role="status" hidden>这是独立小样，暂不连接真实页面。</div>
  <script>
    const asset = (name) => `../src/assets/materials/${name}.png`;
    const ingots = [
      ['common', '普通钢锭', 16, '#85928b'], ['uncommon', '优良钢锭', 0, '#5b986e'],
      ['rare', '稀有钢锭', 14, '#9474b1'], ['ultraRare', '超稀钢锭', 8, '#cbac52'],
      ['epic', '史诗钢锭', 4, '#b9775a'], ['legendary', '传说钢锭', 2, '#d59443'],
      ['mythic', '神话钢锭', 0, '#70b9cb'],
    ].map(([key, name, count, color]) => ({ id: `ingot-${key}`, name, count, color, image: asset(`ingot-${key}`), group: '钢锭', purpose: '同稀有度武器淬炼', source: '战斗 · 活动 · 宝箱', action: '查看可淬炼武器' }));
    const colors = [['blue', '水', '#6798c3'], ['green', '自然', '#72a37b'], ['red', '火', '#c37b74'], ['yellow', '风', '#cbb070'], ['purple', '魔法', '#9e85b5'], ['brown', '土', '#ad9172']];
    const tiers = [['minor', '初级'], ['major', '高级'], ['runic', '符文']];
    const stones = tiers.flatMap(([tier, label], tierIndex) => colors.map(([key, colorName, color], index) => ({ id: `${tier}-${key}`, name: `${label}${colorName}之石`, count: tierIndex === 0 ? [8, 12, 0, 4, 3, 0][index] : tierIndex === 1 ? [0, 5, 2, 0, 1, 0][index] : [1, 0, 0, 0, 0, 0][index], color, image: asset(`stone-${tier}-${key}`), group: `${label} · ${colorName}`, purpose: `解锁${colorName}系部队特质`, source: '活动 · 探索 · 宝箱', action: '查看部队特质' })));
    stones.push({ id: 'celestial', name: '圣辉石', count: 1, color: '#8cb9c9', image: asset('stone-celestial'), group: '圣辉', purpose: '高阶特质解锁', source: '活动 · 荣誉奖励', action: '查看部队特质' });
    const supplies = [
      { id: 'scroll', name: '熔铸符卷', count: 3, color: '#a78bb5', image: asset('scroll-forge'), group: '符卷', purpose: '末日武器淬炼', source: '活动 · 赛季奖励', action: '查看末日武器' },
      { id: 'arenaTicket', name: '竞技场免费票', count: 1, color: '#b78a50', image: '', group: '每周资格', purpose: '本周首次竞技场报名免费', source: '周一重置 · 不可累积', action: '前往竞技场' },
      { id: 'map', name: '藏宝图', count: 2, color: '#bb995d', image: '', group: '门票', purpose: '寻宝 · 每次消耗 1 张', source: '活动 · 冒险', action: '查看寻宝' },
    ];
    const groups = { ingots: { name: '钢锭', title: '钢锭', items: ingots }, stones: { name: '特质石', title: '特质石', items: stones }, supplies: { name: '符卷·门票', title: '符卷·门票', items: supplies } };
    const tabIcons = {
      ingots: '<svg viewBox="0 0 24 24"><path d="m4 16 3-8h10l3 8-3 3H7Z"/><path d="M7 8h10M4 16h16"/></svg>',
      stones: '<svg viewBox="0 0 24 24"><path d="m12 2 9 8-9 12-9-12Z"/><path d="M3 10h18M12 2l-4 8 4 12 4-12Z"/></svg>',
      supplies: '<svg viewBox="0 0 24 24"><path d="M6 4h12v16H6zM9 4v16m3-11h4m-4 4h4"/></svg>',
    };
    const state = { group: 'ingots', selected: 'ingot-common' };
    const byId = (id) => document.getElementById(id);
    const art = (item) => item.image ? `<img src="${item.image}" alt="" draggable="false">` : item.id === 'arenaTicket' ? '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M8 17h48v12a4 4 0 0 0 0 8v12H8V37a4 4 0 0 0 0-8Z" fill="#e9d8b2" stroke="#a47738" stroke-width="3"/><path d="M30 17v32m7-23 3 5 5 1-4 4 1 6-5-3-5 3 1-6-4-4 5-1Z" fill="#c29250" stroke="#a47738" stroke-width="2"/></svg>' : '<svg viewBox="0 0 64 64" aria-hidden="true"><path d="M9 14 25 9 41 14 55 9v41l-14 5-16-5-16 5Z" fill="#e6d5ac" stroke="#ad8850" stroke-width="2"/><path d="M25 9v41m16-36v41M17 39l8-9 9 6 12-13" fill="none" stroke="#ad8850" stroke-width="2"/><circle cx="42" cy="31" r="4" fill="#b77462"/></svg>';
    function select(item, open = false) {
      state.selected = item.id;
      document.querySelectorAll('.item').forEach((button) => {
        const selected = button.dataset.item === item.id;
        button.classList.toggle('selected', selected);
        button.setAttribute('aria-pressed', String(selected));
      });
      byId('detail-overline').textContent = item.group;
      byId('detail-art').innerHTML = art(item);
      byId('detail-name').textContent = item.name;
      byId('detail-count').textContent = item.count;
      byId('detail-purpose').textContent = item.purpose;
      byId('detail-source').textContent = item.source;
      byId('detail-action').textContent = `${item.action} →`;
      if (open && window.matchMedia('(max-width: 730px)').matches) {
        byId('detail').classList.add('open');
        byId('detail-backdrop').hidden = false;
        byId('detail-close').focus();
      }
    }
    function render() {
      const group = groups[state.group];
      byId('tabs').innerHTML = Object.entries(groups).map(([id, entry]) => `<button class="tab ${id === state.group ? 'active' : ''}" type="button" data-group="${id}" aria-current="${id === state.group ? 'page' : 'false'}"><span class="tab-icon" aria-hidden="true">${tabIcons[id]}</span>${entry.name}<strong>${entry.items.filter((item) => item.count > 0).length}</strong></button>`).join('');
      byId('category-title').textContent = group.title;
      const items = byId('owned-only').checked ? group.items.filter((item) => item.count > 0) : group.items;
      byId('grid').dataset.category = state.group;
      byId('grid').innerHTML = items.map((item) => `<button class="item ${item.count ? '' : 'empty'}" type="button" data-item="${item.id}" style="--rarity:${item.color}" aria-label="${item.name}，${item.count ? `持有 ${item.count}` : '未获得'}" aria-pressed="false"><span class="rarity-line"></span><span class="item-art">${art(item)}</span><span class="item-name">${item.name}</span><span class="item-amount">${item.count ? `×${item.count}` : '未获得'}</span></button>`).join('');
      byId('empty-message').hidden = items.length > 0;
      const current = items.find((item) => item.id === state.selected) ?? items[0] ?? group.items[0];
      select(current);
      document.querySelectorAll('[data-group]').forEach((button) => button.addEventListener('click', () => { state.group = button.dataset.group; state.selected = groups[state.group].items.find((item) => item.count > 0)?.id ?? groups[state.group].items[0].id; closeDetail(); render(); }));
      document.querySelectorAll('[data-item]').forEach((button) => button.addEventListener('click', () => select(group.items.find((item) => item.id === button.dataset.item), true)));
    }
    byId('owned-only').addEventListener('change', render);
    function closeDetail() { byId('detail').classList.remove('open'); byId('detail-backdrop').hidden = true; document.querySelector('.item.selected')?.focus(); }
    byId('detail-close').addEventListener('click', closeDetail);
    byId('detail-backdrop').addEventListener('click', closeDetail);
    document.addEventListener('keydown', (event) => { if (event.key === 'Escape' && byId('detail').classList.contains('open')) closeDetail(); });
    byId('detail-action').addEventListener('click', () => { byId('toast').hidden = false; clearTimeout(window.toastTimer); window.toastTimer = setTimeout(() => { byId('toast').hidden = true; }, 2300); });
    byId('mode-switch').addEventListener('click', () => { const dusk = document.body.dataset.theme !== 'dusk'; document.body.dataset.theme = dusk ? 'dusk' : 'day'; byId('mode-switch').textContent = dusk ? '☀ 柔光模式' : '☾ 暮光模式'; });
    render();
  </script>
</body>
</html>
