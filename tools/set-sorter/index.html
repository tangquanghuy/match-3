<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>种类分拣</title>
  <style>
    :root {
      --bg: #16130f;
      --panel: #241f19;
      --line: #3a3228;
      --text: #f4efe6;
      --muted: #b3a794;
      --gold: #e2b15a;
      --ok: #7dcea0;
      --danger: #d85a4a;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px 12px;
      padding: 8px 14px;
      border-bottom: 1px solid var(--line);
    }
    .folder { display: flex; gap: 8px; align-items: center; flex: 1; min-width: 320px; }
    .folder span { color: var(--muted); font-size: 13px; flex: none; }
    .folder input, .actions button, .cats button, .folder button {
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 8px;
      font: inherit;
    }
    .folder input { flex: 1; min-width: 0; padding: 7px 10px; }
    .folder button, #finish { flex: none; min-height: 34px; padding: 6px 12px; cursor: pointer; }
    .folder button:hover:not(:disabled), .actions button:hover:not(:disabled), .cats button:hover { border-color: var(--gold); }
    button:disabled { opacity: 0.35; cursor: default; }
    input:focus, button:focus-visible { outline: 2px solid var(--gold); }
    .meta { color: var(--muted); font-size: 13px; }
    .error { color: var(--danger); font-size: 13px; min-height: 1.2em; }
    .workspace { min-height: 0; display: grid; grid-template-columns: 220px minmax(0, 1fr) 150px; }
    .cats { overflow: auto; border-right: 1px solid var(--line); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .cats button { text-align: left; padding: 7px 8px; cursor: pointer; }
    .cats button.on { border-color: var(--gold); }
    .cats button.done { color: var(--ok); }
    .cats b { display: block; font-weight: 650; }
    .cats small { color: var(--muted); }
    .stage { min-height: 0; display: grid; grid-template-rows: auto minmax(0, 1fr); background: #100e0c; position: relative; }
    .caption { margin: 0; padding: 8px 16px 4px; text-align: center; font-size: 20px; font-weight: 650; }
    .stage img { width: 100%; height: 100%; object-fit: contain; }
    .stage.picked { box-shadow: inset 0 0 0 3px var(--ok); }
    .stamp {
      display: none;
      position: absolute;
      top: 56px;
      right: 16px;
      padding: 6px 10px;
      border: 2px solid var(--ok);
      color: var(--ok);
      font-weight: 700;
      background: rgba(22, 19, 15, 0.72);
    }
    .stage.picked .stamp { display: block; }
    .empty { position: absolute; inset: 48px 0 0; display: flex; align-items: center; justify-content: center; color: var(--muted); }
    .empty[hidden] { display: none; }
    .actions { min-height: 0; border-left: 1px solid var(--line); display: flex; flex-direction: column; }
    .action-stack {
      flex: none;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .actions button { width: 100%; min-height: 46px; cursor: pointer; }
    #pick { background: var(--ok); color: #102018; border-color: transparent; font-weight: 700; }
    #finish:not(:disabled) { background: var(--gold); color: #24180a; border-color: transparent; font-weight: 700; }
    .thumbs { flex: 1; min-height: 0; margin: 0 10px 10px; overflow: auto; display: flex; flex-direction: column; gap: 6px; }
    .thumbs button { min-height: 0; padding: 4px; font-size: 11px; }
    .thumbs img { width: 100%; height: 56px; object-fit: contain; display: block; background: #100e0c; }
    .thumbs button.on { border-color: var(--gold); }
    .thumbs button.picked { border-color: var(--ok); }
    .thumbs button.blocked { opacity: 0.38; }
    .thumbs button.blocked img { filter: grayscale(1); }
    .stage.blocked .stamp { display: block; border-color: var(--muted); color: var(--muted); }
    .veil { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; }
    .veil[hidden] { display: none; }
    .dialog { width: min(460px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
    .dialog p { margin: 0 0 14px; line-height: 1.5; }
    .dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  </style>
</head>
<body>
  <header>
    <label class="folder"><span>样板</span><input id="template" type="text" spellcheck="false" aria-label="样板文件夹" placeholder="种类和数量的样板" /><button id="pickTemplate" type="button">选择</button></label>
    <label class="folder"><span>待分拣</span><input id="sort" type="text" spellcheck="false" aria-label="待分拣文件夹" placeholder="带种类前缀的图片" /><button id="pickSort" type="button">选择</button></label>
    <div class="meta" id="meta">正在读取</div>
    <button id="finish" type="button" disabled>完成并重命名</button>
    <div class="error" id="error"></div>
  </header>
  <div class="workspace">
    <aside class="cats" id="cats"></aside>
    <div class="stage" id="stage">
      <div class="caption" id="caption">正在读取</div>
      <img id="pic" alt="" hidden />
      <div class="stamp" id="stamp">通过</div>
      <div class="empty" id="empty" hidden>先选择两个文件夹</div>
    </div>
    <aside class="actions">
      <div class="action-stack">
        <button id="prev" type="button">上一张</button>
        <button id="next" type="button">下一张</button>
        <button id="pick" type="button">选中这张</button>
        <button id="undo" type="button">撤销上一笔</button>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </aside>
  </div>
  <div class="veil" id="veil" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="askTitle">
      <h2 id="askTitle">完成分拣</h2>
      <p id="askCopy"></p>
      <div class="row">
        <button id="cancelFinish" type="button">先不改名</button>
        <button id="confirmFinish" type="button">按当前选择改名</button>
      </div>
    </section>
  </div>
  <script>
    const templateEl = document.querySelector('#template')
    const sortEl = document.querySelector('#sort')
    const metaEl = document.querySelector('#meta')
    const errorEl = document.querySelector('#error')
    const captionEl = document.querySelector('#caption')
    const stageEl = document.querySelector('#stage')
    const picEl = document.querySelector('#pic')
    const emptyEl = document.querySelector('#empty')
    const stampEl = document.querySelector('#stamp')
    const catsEl = document.querySelector('#cats')
    const thumbsEl = document.querySelector('#thumbs')
    const finishBtn = document.querySelector('#finish')
    const pickBtn = document.querySelector('#pick')
    const undoBtn = document.querySelector('#undo')
    const prevBtn = document.querySelector('#prev')
    const nextBtn = document.querySelector('#next')
    const veil = document.querySelector('#veil')

    let state = { groups: [], rev: 0 }
    let gi = 0
    let ii = 0
    let busy = false

    function workGroups() {
      return (state.groups || []).filter((group) => group.need > 0)
    }

    function current() {
      const group = workGroups()[gi]
      return group && group.files[ii]
    }

    function srcOf(name) {
      return '/img?name=' + encodeURIComponent(name) + '&rev=' + (state.rev || 0)
    }

    function locate(fileName, preferGroup) {
      const groups = workGroups()
      if (preferGroup) {
        const g = groups.findIndex((group) => group.name === preferGroup)
        if (g >= 0) {
          const i = groups[g].files.findIndex((file) => file.name === fileName)
          if (i >= 0) return { gi: g, ii: i }
        }
      }
      for (let g = 0; g < groups.length; g++) {
        const i = groups[g].files.findIndex((file) => file.name === fileName && !file.usedBy)
        if (i >= 0) return { gi: g, ii: i }
      }
      return null
    }

    function applyState(next, preferName, preferGroup) {
      const stay = preferName || (current() && current().name)
      const stayGroup = preferGroup || (workGroups()[gi] && workGroups()[gi].name)
      state = next
      templateEl.value = next.template || ''
      sortEl.value = next.sort || ''
      const found = stay ? locate(stay, stayGroup) : null
      if (found) {
        gi = found.gi
        ii = found.ii
      } else if (gi >= workGroups().length) {
        gi = 0
        ii = 0
      }
      const group = workGroups()[gi]
      if (group && ii >= group.files.length) ii = 0
      render()
    }

    async function refresh(preferName) {
      const res = await fetch('/api/state')
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || '读取失败')
      applyState(data, preferName)
    }

    function chosenIndex(group, dir) {
      const picked = group.files.findIndex((file) => file.order > 0)
      if (picked >= 0) return picked
      if (dir < 0) return Math.max(0, group.files.length - 1)
      return 0
    }

    function showGroup(index, dir) {
      const groups = workGroups()
      const group = groups[index]
      if (!group) return
      gi = index
      ii = chosenIndex(group, dir)
      render()
    }

    function step(dir) {
      const groups = workGroups()
      if (!groups.length) return
      const count = groups[gi].files.length
      const next = ii + dir
      if (next >= 0 && next < count) {
        ii = next
        render()
      } else if (dir > 0 && gi < groups.length - 1) showGroup(gi + 1, 1)
      else if (dir < 0 && gi > 0) showGroup(gi - 1, -1)
    }

    function render() {
      const groups = workGroups()
      const group = groups[gi]
      const file = current()
      const ready = state.ready || 0
      const total = state.categories || 0
      metaEl.textContent = total ? `已齐 ${ready} / ${total} 类 · 已选 ${state.picked || 0} / ${state.need || 0}` : ''
      finishBtn.disabled = !state.picked
      catsEl.replaceChildren(...groups.map((item, index) => {
        const got = item.files.filter((entry) => entry.order > 0).length
        const button = document.createElement('button')
        button.type = 'button'
        button.className = (index === gi ? 'on ' : '') + (got === item.need ? 'done' : '')
        const title = document.createElement('b')
        title.textContent = item.name
        const small = document.createElement('small')
        small.textContent = `${got} / ${item.need}`
        button.append(title, small)
        button.addEventListener('click', () => {
          showGroup(index, 1)
        })
        return button
      }))
      if (!group || !file) {
        captionEl.textContent = state.sort ? '这一类没有待选图片' : '请选择文件夹'
        emptyEl.hidden = false
        emptyEl.textContent = state.sort ? '样板里的这一类，在待分拣文件夹里没有对应前缀' : '先选择样板文件夹和待分拣文件夹'
        picEl.hidden = true
        stageEl.classList.remove('picked', 'blocked')
        thumbsEl.replaceChildren()
        prevBtn.disabled = true
        nextBtn.disabled = true
        pickBtn.disabled = true
        undoBtn.disabled = false
        return
      }
      emptyEl.hidden = true
      picEl.hidden = false
      const future = file.order ? group.name : file.usedBy ? `已选给 ${file.usedBy}` : `${group.name} · 未选`
      captionEl.textContent = file.usedBy ? `已选给 ${file.usedBy}` : file.name
      stampEl.textContent = file.order ? `通过 · ${group.name}` : file.usedBy ? `已选给 ${file.usedBy}` : ''
      stageEl.classList.toggle('picked', file.order > 0)
      stageEl.classList.toggle('blocked', Boolean(file.usedBy))
      picEl.src = srcOf(file.name)
      picEl.alt = future
      document.title = future
      const atStart = gi === 0 && ii === 0
      const atEnd = gi === groups.length - 1 && ii === group.files.length - 1
      prevBtn.disabled = atStart
      nextBtn.disabled = atEnd
      pickBtn.disabled = Boolean(file.usedBy)
      pickBtn.textContent = file.order ? '撤销这张' : file.usedBy ? '不能再选' : '选中这张'
      thumbsEl.replaceChildren(...group.files.map((item, index) => {
        const button = document.createElement('button')
        button.type = 'button'
        button.className = (index === ii ? 'on ' : '') + (item.order ? 'picked ' : '') + (item.usedBy ? 'blocked' : '')
        const img = document.createElement('img')
        img.src = srcOf(item.name)
        img.alt = ''
        const caption = document.createElement('div')
        caption.textContent = item.order ? group.name : item.usedBy ? `已选给 ${item.usedBy}` : item.name
        button.append(img, caption)
        button.addEventListener('click', () => {
          ii = index
          render()
        })
        return button
      }))
      const thumb = thumbsEl.children[ii]
      if (thumb) thumb.scrollIntoView({ block: 'nearest' })
    }

    async function post(url, body) {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body || {}),
      })
      const data = await res.json()
      if (!res.ok) throw new Error(data.error || '操作失败')
      return data
    }

    async function openTyped(which, input) {
      errorEl.textContent = ''
      try {
        applyState(await post('/api/folder', { which, path: input.value.trim() }), current() && current().name)
      } catch (err) {
        errorEl.textContent = err.message
      }
    }

    async function browse(which, button) {
      button.disabled = true
      errorEl.textContent = ''
      try {
        const data = await post('/api/pick-folder', { which })
        if (!data.cancelled) applyState(data)
      } catch (err) {
        errorEl.textContent = err.message
      } finally {
        button.disabled = false
      }
    }

    async function toggleCurrent() {
      const file = current()
      const slot = workGroups()[gi]?.name
      if (!file || file.usedBy || busy) return
      busy = true
      errorEl.textContent = ''
      try {
        applyState(await post('/api/toggle', { name: file.name, slot }), file.name, slot)
      } catch (err) {
        errorEl.textContent = err.message
      } finally {
        busy = false
      }
    }

    async function undoLast() {
      if (busy) return
      busy = true
      errorEl.textContent = ''
      try {
        applyState(await post('/api/undo'), current() && current().name)
      } catch (err) {
        errorEl.textContent = err.message
      } finally {
        busy = false
      }
    }

    document.querySelector('#pickTemplate').addEventListener('click', (event) => browse('template', event.currentTarget))
    document.querySelector('#pickSort').addEventListener('click', (event) => browse('sort', event.currentTarget))
    templateEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') { event.preventDefault(); openTyped('template', templateEl) }
    })
    sortEl.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') { event.preventDefault(); openTyped('sort', sortEl) }
    })
    prevBtn.addEventListener('click', () => step(-1))
    nextBtn.addEventListener('click', () => step(1))
    pickBtn.addEventListener('click', () => toggleCurrent())
    undoBtn.addEventListener('click', () => undoLast())
    finishBtn.addEventListener('click', () => {
      document.querySelector('#askCopy').textContent = `选中的 ${state.picked} 张会改成左边显示的编号，例如种类1、种类2。所有未选中的图片（包括尚未选择的种类）都会挪到「${state.aside}」。改名之后就不能用撤销把文件名改回去。`
      veil.hidden = false
    })
    document.querySelector('#cancelFinish').addEventListener('click', () => { veil.hidden = true })
    document.querySelector('#confirmFinish').addEventListener('click', async () => {
      veil.hidden = true
      errorEl.textContent = ''
      finishBtn.disabled = true
      try {
        const data = await post('/api/finish')
        applyState(data)
        errorEl.textContent = `已改名 ${data.renamed} 张，未入选 ${data.parked} 张已挪走`
      } catch (err) {
        errorEl.textContent = err.message
        finishBtn.disabled = false
      }
    })
    window.addEventListener('keydown', (event) => {
      if (event.target === templateEl || event.target === sortEl || !veil.hidden) return
      if (event.key === 'ArrowRight') { event.preventDefault(); step(1) }
      else if (event.key === 'ArrowLeft') { event.preventDefault(); step(-1) }
      else if (event.key === 'Enter' || event.key === 'Delete') { event.preventDefault(); toggleCurrent() }
      else if (event.key === 'z' && (event.ctrlKey || event.metaKey)) { event.preventDefault(); undoLast() }
    })

    refresh().catch(() => {
      captionEl.textContent = '读取失败'
      errorEl.textContent = '没能读到分拣数据'
    })
  </script>
</body>
</html>
